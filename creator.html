<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator | PIXORA</title>
    <link rel="stylesheet" href="style.css?v=4">

    <style>
        .profile-page {
            width: min(1050px, calc(100% - 28px));
            margin: auto;
            padding: 30px 0 110px;
        }

        .creator-profile {
            padding: 25px;
            border-radius: 22px;
            border: 1px solid rgba(255,255,255,.07);
            background: rgba(18,18,26,.85);
            margin-bottom: 25px;
        }

        .profile-top {
            display: flex;
            gap: 18px;
            align-items: center;
        }

        .profile-avatar {
            width: 82px;
            height: 82px;
            border-radius: 50%;
            overflow: hidden;
            display: grid;
            place-items: center;
            flex: 0 0 auto;
            background: linear-gradient(135deg,#ff1744,#7c3aed);
            font-size: 28px;
            font-weight: 950;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-name {
            font-size: 25px;
            font-weight: 950;
        }

        .profile-username {
            color: #ff4d70;
            font-size: 13px;
            font-weight: 800;
            margin-top: 3px;
        }

        .profile-bio {
            margin-top: 12px;
            color: #9999a5;
            font-size: 13px;
        }

        .profile-actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .profile-actions button {
            min-height: 42px;
            padding: 0 17px;
            border-radius: 12px;
            color: #fff;
            font-weight: 850;
        }

        #messageCreatorBtn {
            background: linear-gradient(135deg,#ff1744,#7c3aed);
        }

        #backCreatorsBtn {
            background: rgba(255,255,255,.07);
        }

        .profile-content-title {
            margin: 25px 0 14px;
            font-size: 20px;
            font-weight: 900;
        }

        .profile-empty {
            padding: 40px;
            text-align: center;
            color: #858590;
        }

        @media(max-width:600px) {
            .profile-top {
                align-items: flex-start;
            }

            .profile-avatar {
                width: 65px;
                height: 65px;
            }

            .profile-name {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

<header class="topbar">
    <a href="index.html" class="logo">PIX<span>ORA</span></a>

    <div class="top-actions">
        <a href="messages.html" class="icon-btn">💬</a>
        <a href="creators.html" class="auth-btn">Creators</a>
    </div>
</header>

<main class="profile-page">

    <section id="profileCard" class="creator-profile">

        <div class="profile-top">

            <div id="profileAvatar" class="profile-avatar">P</div>

            <div>
                <div id="profileName" class="profile-name">
                    Loading...
                </div>

                <div id="profileUsername" class="profile-username"></div>

                <div id="profileBio" class="profile-bio"></div>
            </div>

        </div>

        <div class="profile-actions">
            <button id="messageCreatorBtn">
                💬 Message
            </button>

            <button id="backCreatorsBtn">
                ← Creators
            </button>
        </div>

    </section>

    <h2 class="profile-content-title">
        Creator Content
    </h2>

    <div id="creatorContent" class="profile-empty">
        Creator content will appear here.
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>

<script>
document.addEventListener("DOMContentLoaded", async () => {

    const supabase = window.pixoraSupabase;

    const params = new URLSearchParams(location.search);
    const creatorId = params.get("id");

    const nameEl = document.getElementById("profileName");
    const usernameEl = document.getElementById("profileUsername");
    const bioEl = document.getElementById("profileBio");
    const avatarEl = document.getElementById("profileAvatar");
    const messageBtn = document.getElementById("messageCreatorBtn");
    const content = document.getElementById("creatorContent");

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g,"&amp;")
            .replace(/</g,"&lt;")
            .replace(/>/g,"&gt;")
            .replace(/"/g,"&quot;")
            .replace(/'/g,"&#039;");
    }

    if (!creatorId) {
        nameEl.textContent = "Creator not found";
        messageBtn.disabled = true;
        return;
    }

    const { data: profile, error } =
        await supabase
            .from("profiles")
            .select("user_id,username,display_name,bio,avatar_url")
            .eq("user_id", creatorId)
            .maybeSingle();

    if (error || !profile) {
        nameEl.textContent = "Creator not found";
        messageBtn.disabled = true;
        return;
    }

    nameEl.textContent =
        profile.display_name ||
        profile.username ||
        "PIXORA Creator";

    usernameEl.textContent =
        profile.username ? "@" + profile.username : "";

    bioEl.textContent =
        profile.bio || "PIXORA creator";

    if (profile.avatar_url) {
        avatarEl.innerHTML =
            `<img src="${escapeHtml(profile.avatar_url)}" alt="">`;
    } else {
        avatarEl.textContent =
            (profile.display_name ||
            profile.username ||
            "P").charAt(0).toUpperCase();
    }

    const { data: wallpapers } =
        await supabase
            .from("wallpapers")
            .select("id,title,image_url,category,views,downloads")
            .eq("user_id", creatorId)
            .eq("status","approved")
            .order("created_at",{ascending:false})
            .limit(24);

    if (wallpapers?.length) {

        const grid = document.createElement("div");
        grid.className = "wallpaper-grid";

        wallpapers.forEach(item => {

            const card = document.createElement("article");
            card.className = "wallpaper-card";

            card.innerHTML = `
                <div class="wallpaper-art">
                    <img
                        class="wallpaper-image"
                        src="${escapeHtml(item.image_url || "")}"
                        alt="${escapeHtml(item.title || "Wallpaper")}"
                        loading="lazy"
                    >
                </div>
                <div class="wallpaper-info">
                    <strong>${escapeHtml(item.title || "Wallpaper")}</strong>
                    <small>${escapeHtml(item.category || "")}</small>
                </div>
            `;

            grid.appendChild(card);
        });

        content.innerHTML = "";
        content.appendChild(grid);
    } else {
        content.textContent =
            "This creator has no public wallpapers yet.";
    }

    messageBtn.addEventListener("click", async () => {

        const { data: sessionData } =
            await supabase.auth.getSession();

        const user = sessionData.session?.user;

        if (!user) {
            location.href = "login.html";
            return;
        }

        if (user.id === creatorId) {
            location.href = "account.html";
            return;
        }

        const { data, error } =
            await supabase.rpc(
                "start_private_conversation",
                {
                    p_other_user: creatorId
                }
            );

        if (error) {
            console.error(error);
            alert("Could not start conversation.");
            return;
        }

        location.href =
            "messages.html?conversation=" +
            encodeURIComponent(data);
    });

    document
        .getElementById("backCreatorsBtn")
        .addEventListener("click", () => {
            location.href = "creators.html";
        });
});
</script>

</body>
  </html>
