            await supabase.rpc("create_poll", {
                p_conversation_id: active.id,
                p_question: question,
                p_options: options,
                p_allow_multiple: $("pollAllowMultiple").checked,
                p_hide_results: $("pollHideResults").checked,
                p_closes_at: null
            });

        if (error) {

            status.textContent = "Could not create the poll. Try again.";

        await loadMessages();

        scheduleListRefresh();

    async function startTyping() {

        if (!active || blockedByMe) {
            return;
        }

        if (!typingActive) {

            typingActive = true;

            const { error } =
                await supabase.rpc(
                    "set_typing",
                    {
                        p_conversation_id:
                            active.id
                    }
                );

            if (error) {
                console.error(
                    "set_typing:",
                    error
                );
            }
        }

        clearTimeout(typingTimer);

        typingTimer =
            setTimeout(
                stopTyping,
                1800
            );

    async function stopTyping() {

        clearTimeout(typingTimer);

        typingTimer = null;

        if (!typingActive || !active) {
            return;
        }

        typingActive = false;

        const { error } =
            await supabase.rpc(
                "stop_typing",
                {
                    p_conversation_id:
                        active.id
                }
            );

        if (error) {
            console.error(
                "stop_typing:",
                error
            );
        }
    }

        () => {

                messageInput.value.trim()
            ) {
                startTyping();

    );

    /* =====================================================
       CHECK OTHER PERSON TYPING
       ===================================================== */

    async function refreshTyping() {

        if (!active || active.isGroup) {
            setTypingStatus("");
            return;
        }

        const { data, error } =
            await supabase
                .from("typing_status")
                .select(
                    "user_id,updated_at"
                )
                .eq(
                    "conversation_id",
                    active.id
                )
                .neq(
                    "user_id",
                    me.id
                );

        if (error) {
            console.error(
                "typing_status:",
                error
            );

            return;
        }

        const current =
            Date.now();

        const typing =
            (data || []).some(
                row =>
                    current -
                    new Date(
                        row.updated_at
                    ).getTime()
                    < 4000
            );

        setTypingStatus(
            typing
                ? displayName(active.profile) +
                  " is typing..."
                : ""
        );
    }

    /* =====================================================
       VOICE MESSAGES
       ===================================================== */

    const MAX_RECORD_SECONDS = 180;

    let recorder = null;
    let recordStream = null;
    let recordChunks = [];
    let recordStartedAt = 0;
    let recordTimer = null;
    let finishing = false;

    const canRecord =
        !!(
            navigator.mediaDevices &&
            navigator.mediaDevices.getUserMedia &&
            window.MediaRecorder
        );

    if (!canRecord) {
        $("micBtn").hidden = true;
    }

    function pickMimeType() {

        const options = [
            "audio/webm;codecs=opus",
            "audio/webm",
            "audio/mp4",
            "audio/ogg;codecs=opus"
        ];

        return options.find(
            type =>
                window.MediaRecorder.isTypeSupported &&
                MediaRecorder.isTypeSupported(type)
        ) || "";
    }

    function showRecordingUi(recording) {

        $("recordControls").hidden =
            !recording;

        messageInput.hidden =
            recording;

        $("micBtn").hidden =
            recording || !canRecord;

        $("attachBtn").hidden =
            recording;

        $("pollBtn").hidden =
            recording;

        $("sendBtn").hidden =
            recording;
    }

    function stopTracks() {

        clearInterval(recordTimer);

        recordTimer = null;

        if (recordStream) {

            recordStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );
        }

        recordStream = null;

        recorder = null;

        recordChunks = [];

        showRecordingUi(false);
    }

    function cancelRecordingSilently() {

        if (
            recorder &&
            recorder.state !== "inactive"
        ) {

            recorder.onstop = null;

            recorder.stop();
        }

        finishing = false;

        stopTracks();
    }

    async function startRecording() {

        if (
            !active ||
            blockedByMe ||
            recorder
        ) {
            return;
        }

        setStatus("");

        try {

            recordStream =
                await navigator.mediaDevices
                    .getUserMedia({
                        audio:true
                    });

        } catch (error) {

            console.error(error);

            setStatus(
                "Allow microphone access in your browser to send voice messages."
            );

            return;
        }

        const mimeType =
            pickMimeType();

        try {

            recorder =
                mimeType
                    ? new MediaRecorder(
                        recordStream,
                        { mimeType }
                    )
                    : new MediaRecorder(
                        recordStream
                    );

        } catch (error) {

            console.error(error);

            stopTracks();

            setStatus(
                "Voice messages aren't supported in this browser."
            );

            return;
        }

        recordChunks = [];

        recorder.ondataavailable =
            event => {

                if (
                    event.data &&
                    event.data.size
                ) {

                    recordChunks.push(
                        event.data
                    );
                }
            };

        recorder.start();

        recordStartedAt =
            Date.now();

        $("recordTime").textContent =
            "0:00";

        showRecordingUi(true);

        recordTimer =
            setInterval(
                () => {

                    const elapsed =
                        (
                            Date.now() -
                            recordStartedAt
                        ) / 1000;

                    $("recordTime").textContent =
                        formatSeconds(
                            elapsed
                        );

                    if (
                        elapsed >=
                        MAX_RECORD_SECONDS
                    ) {

                        finishRecording(true);
                    }

                },
                250
            );
    }

    function stopRecorder() {

        return new Promise(
            resolve => {

                const current =
                    recorder;

                current.onstop =
                    () => {

                        const type =
                            (
                                current.mimeType ||
                                "audio/webm"
                            ).split(";")[0];

                        resolve({
                            blob:
                                new Blob(
                                    recordChunks,
                                    { type }
                                ),

                            mime:type,

                            seconds:
                                Math.round(
                                    (
                                        Date.now() -
                                        recordStartedAt
                                    ) / 1000
                                )
                        });
                    };

                if (
                    current.state !==
                    "inactive"
                ) {

                    current.stop();

                } else {

                    current.onstop();
                }
            }
        );
    }

    async function finishRecording(send) {

        if (
            !recorder ||
            finishing
        ) {
            return;
        }

        finishing = true;

        const result =
            await stopRecorder();

        stopTracks();

        finishing = false;

        if (!send) return;

        await sendVoice(result);
    }

    async function sendVoice(result) {

        if (
            !active ||
            blockedByMe
        ) {
            return;
        }

        if (
            result.seconds < 1 ||
            result.blob.size < 800
        ) {

            setStatus(
                "That recording was too short."
            );

            return;
        }

        const seconds =
            Math.min(
                300,
                Math.max(
                    1,
                    result.seconds
                )
            );

        const extension =
            result.mime.includes("mp4")
                ? "m4a"
                : result.mime.includes("ogg")
                    ? "ogg"
                    : result.mime.includes("mpeg")
                        ? "mp3"
                        : "webm";

        const path =
            active.id +
            "/" +
            me.id +
            "/" +
            Date.now() +
            "." +
            extension;

        setStatus(
            "Sending voice message..."
        );

        const upload =
            await supabase
                .storage
                .from("voice-messages")
                .upload(
                    path,
                    result.blob,
                    {
                        contentType:
                            result.mime
                    }
                );

        if (upload.error) {

            console.error(
                upload.error
            );

            setStatus(
                "Could not upload the voice message. Try again."
            );

            return;
        }

        const insert =
            await supabase
                .from("messages")
                .insert({
                    conversation_id:
                        active.id,
                    sender_id:
                        me.id,
                    body:"",
                    kind:"audio",
                    audio_path:path,
                    audio_seconds:
                        seconds
                });

        if (insert.error) {

            console.error(
                insert.error
            );

            await supabase
                .storage
                .from("voice-messages")
                .remove([path]);

            setStatus(
                sendErrorText(
                    insert.error
                )
            );

            return;
        }

        setStatus("");

        await loadMessages();

        scheduleListRefresh();
    }

    $("micBtn")
        .addEventListener(
            "click",
            startRecording
        );

    $("recordCancel")
        .addEventListener(
            "click",
            () =>
                finishRecording(false)
        );

    $("recordSend")
        .addEventListener(
            "click",
            () =>
                finishRecording(true)
        );

    /* =====================================================
       REALTIME
       ===================================================== */

    realtimeChannel =
        supabase
            .channel(
                "pixora-messages-" +
                me.id
            )

            .on(
                "postgres_changes",
                {
                    event:"INSERT",
                    schema:"public",
                    table:"messages"
                },
                async payload => {

                    const message =
                        payload.new;

                    if (
                        active &&
                        String(
                            message.conversation_id
                        ) ===
                        String(active.id) &&
                        message.sender_id !== me.id
                    ) {

                        const [urls, pollsByMessage] =
                            await Promise.all([
                                signedUrlsFor([message]),
                                message.kind === "poll"
                                    ? loadPollDataFor([message.id])
                                    : Promise.resolve({})
                            ]);

                        const empty =
                            chatMessages
                                .querySelector(
                                    ".chat-empty"
                                );

                        if (empty) {
                            chatMessages.innerHTML =
                                "";
                        }

                        renderMessage(
                            message,
                            urls,
                            pollsByMessage
                        );

                        chatMessages.scrollTop =
                            chatMessages.scrollHeight;

                        await markConversationRead();
                    }

                    scheduleListRefresh();
                }
            )

            .on(
                "postgres_changes",
                {
                    event:"UPDATE",
                    schema:"public",
                    table:"messages"
                },
                async payload => {

                    const message =
                        payload.new;

                    if (
                        active &&
                        String(
                            message.conversation_id
                        ) ===
                        String(active.id)
                    ) {

                        await loadMessages();
                    }

                    scheduleListRefresh();
                }
            )

            .on(
                "postgres_changes",
                {
                    event:"INSERT",
                    schema:"public",
                    table:"poll_votes"
                },
                async () => {

                    if (active) {
                        await loadMessages();
                    }
                }
            )

            .on(
                "postgres_changes",
                {
                    event:"DELETE",
                    schema:"public",
                    table:"poll_votes"
                },
                async () => {

                    if (active) {
                        await loadMessages();
                    }
                }
            )

            .on(
                "postgres_changes",
                {
                    event:"UPDATE",
                    schema:"public",
                    table:"polls"
                },
                async () => {

                    if (active) {
                        await loadMessages();
                    }
                }
            )

            .on(
                "postgres_changes",
                {
                    event:"*",
                    schema:"public",
                    table:"conversation_members"
                },
                async () => {

                    scheduleListRefresh();

                    if (active && active.isGroup) {
                        await loadActiveMembers();

                        if (!manageModal.hidden) {
                            renderManageMembers();
                        }
                    }
                }
            )

            .on(
                "postgres_changes",
                {
                    event:"INSERT",
                    schema:"public",
                    table:"typing_status"
                },
                async payload => {

                    if (
                        active &&
                        String(
                            payload.new.conversation_id
                        ) ===
                        String(active.id)
                    ) {

                        await refreshTyping();
                    }
                }
            )

            .on(
                "postgres_changes",
                {
                    event:"UPDATE",
                    schema:"public",
                    table:"typing_status"
                },
                async payload => {

                    if (
                        active &&
                        String(
                            payload.new.conversation_id
                        ) ===
                        String(active.id)
                    ) {

                        await refreshTyping();
                    }
                }
            )

            .on(
                "postgres_changes",
                {
                    event:"DELETE",
                    schema:"public",
                    table:"typing_status"
                },
                async payload => {

                    if (
                        active &&
                        String(
                            payload.old.conversation_id
                        ) ===
                        String(active.id)
                    ) {

                        await refreshTyping();
                    }
                }
            )

            .subscribe();

    /* =====================================================
       PERIODIC PRESENCE / TYPING
       ===================================================== */

    async function startPresenceRefresh() {

        clearInterval(
            presenceTimer
        );

        await touchMyPresence();

        presenceTimer =
            setInterval(
                async () => {

                    await touchMyPresence();

                    if (active) {
                        await refreshPresence();
                        await refreshTyping();
                    }

                },
                15000
            );
    }

    document.addEventListener(
        "visibilitychange",
        async () => {

            if (
                document.visibilityState ===
                "visible"
            ) {

                await touchMyPresence();

                if (active) {
                    await refreshPresence();
                    await refreshTyping();
                }
            }
        }
    );

    window.addEventListener(
        "beforeunload",
        () => {

            clearInterval(
                presenceTimer
            );

            clearTimeout(
                typingTimer
            );
        }
    );

    /* =====================================================
       START
       ===================================================== */

    updateComposer();

    await touchMyPresence();

    await loadConversations();

    const requested =
        new URLSearchParams(
            location.search
        ).get("conversation");

    if (requested) {
        await openConversation(
            requested
        );
    }

});
</script>
