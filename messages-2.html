<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages | PIXORA</title>
    <link rel="stylesheet" href="style.css?v=5">

    <style>
        .messages-page {
            width: min(1100px, calc(100% - 20px));
            margin: auto;
            padding: 25px 0 100px;
        }

        .messages-title {
            margin-bottom: 18px;
        }

        .messages-title h1 {
            font-size: 28px;
            font-weight: 950;
        }

        .messages-title p {
            margin-top: 5px;
            color: #90909b;
            font-size: 13px;
        }

        .message-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: 600px;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.07);
            background: #12121a;
        }

        .conversation-list {
            border-right: 1px solid rgba(255,255,255,.07);
            overflow-y: auto;
        }

        .conversation-heading {
            padding: 17px;
            font-size: 13px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .heading-action {
            border: 0;
            background: linear-gradient(135deg,#ff1744,#7c3aed);
            color: #fff;
            font-size: 11px;
            font-weight: 900;
            padding: 6px 10px;
            border-radius: 8px;
        }

        .conversation-item {
            width: 100%;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 11px;
            text-align: left;
            color: #fff;
            background: transparent;
            border-bottom: 1px solid rgba(255,255,255,.04);
        }

        .conversation-item:hover,
        .conversation-item.active {
            background: rgba(255,255,255,.06);
        }

        .conversation-text {
            min-width: 0;
            flex: 1;
        }

        .conversation-user {
            font-weight: 850;
            font-size: 13px;
        }

        .conversation-preview {
            margin-top: 3px;
            color: #858590;
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .unread-badge {
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 20px;
            display: grid;
            place-items: center;
            background: #ff1744;
            color: #fff;
            font-size: 9px;
            font-weight: 900;
        }

        .mini-avatar {
            width: 38px;
            height: 38px;
            flex: 0 0 auto;
            border-radius: 50%;
            overflow: hidden;
            display: grid;
            place-items: center;
            font-size: 14px;
            font-weight: 900;
            background: linear-gradient(135deg,#ff1744,#7c3aed);
        }

        .mini-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .chat-panel {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .chat-header {
            min-height: 60px;
            padding: 10px 17px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            border-bottom: 1px solid rgba(255,255,255,.07);
            font-weight: 900;
        }

        .chat-person {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            color: inherit;
            text-decoration: none;
        }

        .chat-person span:last-child {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .presence-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #666;
            flex: 0 0 auto;
        }

        .presence-dot.online {
            background: #22c55e;
            box-shadow: 0 0 7px rgba(34,197,94,.6);
        }

        .chat-person-wrap {
            min-width: 0;
        }

        .chat-presence {
            margin-top: 2px;
            font-size: 10px;
            color: #777782;
            font-weight: 600;
        }

        .chat-tools {
            display: flex;
            gap: 12px;
            flex-shrink: 0;
        }

        .chat-tools button {
            background: transparent;
            color: #858590;
            font-size: 12px;
            text-decoration: underline;
        }

        .chat-messages {
            flex: 1;
            min-height: 460px;
            max-height: 560px;
            overflow-y: auto;
            padding: 18px;
        }

        .chat-empty {
            height: 100%;
            min-height: 400px;
            display: grid;
            place-items: center;
            color: #777782;
            text-align: center;
            padding: 20px;
        }

        .message-row {
            display: flex;
            margin-bottom: 10px;
            position: relative;
        }

        .message-row.mine {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: min(75%,480px);
            padding: 10px 13px;
            border-radius: 15px;
            background: rgba(255,255,255,.07);
            font-size: 13px;
            line-height: 1.45;
            word-break: break-word;
            position: relative;
        }

        .message-row.mine .message-bubble {
            background: linear-gradient(135deg,#ff1744,#7c3aed);
        }

        .message-bubble.deleted {
            opacity: .72;
            font-style: italic;
        }

        .message-actions {
            display: none;
            position: absolute;
            bottom: -28px;
            z-index: 5;
            padding: 5px;
            border-radius: 9px;
            background: #20202b;
            border: 1px solid rgba(255,255,255,.1);
            box-shadow: 0 5px 20px rgba(0,0,0,.25);
        }

        .message-row.mine .message-actions {
            right: 0;
        }

        .message-row:not(.mine) .message-actions {
            left: 0;
        }

        .message-row.selected .message-actions {
            display: flex;
            gap: 4px;
        }

        .message-actions button {
            border: 0;
            background: transparent;
            color: #fff;
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 800;
        }

        .message-actions button:hover {
            background: rgba(255,255,255,.1);
        }

        .message-actions .delete-action {
            color: #ff8fa3;
        }

        .message-time {
            margin-top: 4px;
            opacity: .55;
            font-size: 9px;
        }

        .message-meta {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 5px;
            margin-top: 3px;
            font-size: 9px;
            opacity: .7;
        }

        .seen-mark {
            font-weight: 900;
        }

        .blocked-banner {
            padding: 12px 17px;
            font-size: 13px;
            text-align: center;
            color: #ffb4c0;
            background: rgba(255,23,68,.1);
            border-top: 1px solid rgba(255,255,255,.07);
        }

        .blocked-banner button {
            margin-left: 8px;
            padding: 6px 12px;
            border-radius: 9px;
            color: #fff;
            background: rgba(255,255,255,.12);
            font-weight: 800;
            font-size: 12px;
        }

        .chat-status {
            min-height: 16px;
            padding: 0 14px;
            font-size: 12px;
            color: #ff8fa3;
        }

        .typing-status {
            min-height: 17px;
            padding: 0 14px 4px;
            font-size: 11px;
            color: #858590;
            font-style: italic;
        }

        .chat-form {
            display: flex;
            gap: 9px;
            padding: 12px;
            border-top: 1px solid rgba(255,255,255,.07);
            align-items: center;
        }

        .chat-form input {
            flex: 1;
            min-width: 0;
            min-height: 44px;
            padding: 0 14px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,.08);
            background: rgba(255,255,255,.05);
            color: #fff;
        }

        .chat-form button {
            min-width: 75px;
            min-height: 44px;
            border-radius: 12px;
            color: #fff;
            background: linear-gradient(135deg,#ff1744,#7c3aed);
            font-weight: 900;
        }

        .chat-form button.mic-btn {
            min-width: 46px;
            width: 46px;
            background: rgba(255,255,255,.09);
            font-size: 18px;
        }

        .record-controls {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .record-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff1744;
            animation: recordPulse 1s ease-in-out infinite;
        }

        @keyframes recordPulse {
            50% { opacity: .25; }
        }

        .record-time {
            flex: 1;
            font-weight: 800;
            font-size: 15px;
        }

        .chat-form button.record-cancel {
            background: rgba(255,255,255,.09);
        }

        /* ============ ATTACHMENTS / FILE MESSAGES ============ */

        .file-bubble {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 2px;
        }

        .file-bubble .file-icon {
            width: 36px;
            height: 36px;
            border-radius: 9px;
            background: rgba(255,255,255,.12);
            display: grid;
            place-items: center;
            font-size: 17px;
            flex: 0 0 auto;
        }

        .file-bubble .file-meta {
            min-width: 0;
        }

        .file-bubble .file-name {
            font-weight: 800;
            font-size: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 190px;
        }

        .file-bubble .file-size {
            font-size: 10px;
            opacity: .7;
        }

        .file-bubble a.file-download {
            margin-left: auto;
            color: #fff;
            text-decoration: underline;
            font-size: 11px;
            flex: 0 0 auto;
        }

        .image-attachment {
            display: block;
            max-width: 220px;
            max-height: 260px;
            border-radius: 12px;
            object-fit: cover;
            cursor: pointer;
        }

        /* ============ POLLS ============ */

        .poll-bubble {
            min-width: 220px;
        }

        .poll-question {
            font-weight: 900;
            font-size: 13px;
            margin-bottom: 9px;
        }

        .poll-option-row {
            position: relative;
            margin-bottom: 7px;
            border-radius: 10px;
            overflow: hidden;
            background: rgba(255,255,255,.08);
        }

        .poll-option-fill {
            position: absolute;
            inset: 0;
            width: 0%;
            background: rgba(255,255,255,.16);
            transition: width .3s ease;
        }

        .poll-option-btn {
            position: relative;
            z-index: 1;
            width: 100%;
            text-align: left;
            padding: 8px 10px;
            background: transparent;
            color: #fff;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .poll-option-btn.voted-option {
            font-weight: 900;
        }

        .poll-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
            font-size: 10px;
            opacity: .75;
        }

        .poll-meta-row button {
            background: transparent;
            color: inherit;
            text-decoration: underline;
            font-size: 10px;
            padding: 0;
            min-height: 0;
            min-width: 0;
        }

        /* ============ GENERIC PIXORA MODAL ============ */

        .pixora-modal {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: grid;
            place-items: center;
            padding: 16px;
        }

        .pixora-modal[hidden] {
            display: none;
        }

        .pixora-modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,.6);
        }

        .pixora-modal-panel {
            position: relative;
            z-index: 1;
            width: min(420px, 100%);
            max-height: 86vh;
            overflow-y: auto;
            background: #16161f;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 18px;
            padding: 22px;
        }

        .pixora-modal-panel h2 {
            font-size: 18px;
            font-weight: 900;
            margin-bottom: 14px;
        }

        .pixora-modal-panel h3 {
            font-size: 12px;
            font-weight: 900;
            margin: 14px 0 8px;
            color: #a6a6b3;
        }

        .pixora-modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255,255,255,.08);
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 16px;
        }

        .pixora-modal-panel input[type="text"] {
            width: 100%;
            min-height: 42px;
            padding: 0 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,.1);
            background: rgba(255,255,255,.05);
            color: #fff;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .pixora-modal-main {
            width: 100%;
            min-height: 44px;
            border-radius: 12px;
            color: #fff;
            background: linear-gradient(135deg,#ff1744,#7c3aed);
            font-weight: 900;
            margin-top: 6px;
        }

        .pixora-modal-danger {
            width: 100%;
            min-height: 40px;
            border-radius: 12px;
            color: #ff8fa3;
            background: rgba(255,23,68,.12);
            font-weight: 800;
            margin-top: 14px;
        }

        .pixora-modal-status {
            margin-top: 10px;
            font-size: 12px;
            color: #ff8fa3;
            min-height: 14px;
        }

        .member-results {
            max-height: 150px;
            overflow-y: auto;
            margin-bottom: 8px;
        }

        .member-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 4px;
            font-size: 12px;
        }

        .member-row .member-name {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .member-row button {
            background: rgba(255,255,255,.1);
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            padding: 5px 9px;
            border-radius: 7px;
            min-height: 0;
            min-width: 0;
        }

        .member-row button.remove-member {
            background: rgba(255,23,68,.14);
            color: #ff8fa3;
        }

        .member-role-badge {
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 6px;
            background: rgba(255,255,255,.1);
            font-weight: 800;
        }

        .member-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }

        .member-chip {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(124,58,237,.25);
            padding: 5px 8px;
            border-radius: 20px;
            font-size: 11px;
        }

        .member-chip button {
            background: transparent;
            color: #fff;
            font-size: 12px;
            padding: 0;
            min-height: 0;
            min-width: 0;
        }

        .poll-option-input-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .poll-option-input-row input {
            flex: 1;
        }

        .poll-option-input-row button {
            background: rgba(255,23,68,.12);
            color: #ff8fa3;
            font-size: 14px;
            min-width: 34px;
            width: 34px;
            min-height: 34px;
            border-radius: 8px;
        }

        #pollAddOption {
            width: 100%;
            min-height: 38px;
            background: rgba(255,255,255,.08);
            color: #fff;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .pixora-modal-panel label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            margin-bottom: 8px;
            color: #d0d0d8;
        }

        @media(max-width:700px) {
            .message-layout {
                grid-template-columns: 1fr;
            }

            .conversation-list {
                max-height: 190px;
                border-right: 0;
                border-bottom: 1px solid rgba(255,255,255,.07);
            }

            .chat-messages {
                min-height: 390px;
            }

            .message-bubble {
                max-width: 82%;
            }
        }

        .light-mode .message-layout {
            background: #fff;
            border-color: rgba(0,0,0,.08);
        }

        .light-mode .conversation-item {
            color: #111116;
        }

        .light-mode .chat-form input {
            color: #111116;
            background: #f1f1f5;
            border-color: rgba(0,0,0,.08);
        }

        .light-mode .message-bubble {
            background: #eeeef3;
        }

        .light-mode .message-row.mine .message-bubble {
            color: #fff;
        }

        .light-mode .chat-form button.mic-btn,
        .light-mode .chat-form button.record-cancel {
            color: #111116;
            background: #e8e8ee;
        }

        .light-mode .message-actions {
            background: #fff;
            border-color: rgba(0,0,0,.1);
        }

        .light-mode .message-actions button {
            color: #111116;
        }

        .light-mode .message-actions .delete-action {
            color: #e11d48;
        }

        .light-mode .pixora-modal-panel {
            background: #fff;
            color: #111116;
            border-color: rgba(0,0,0,.08);
        }

        .light-mode .pixora-modal-panel input[type="text"] {
            background: #f1f1f5;
            color: #111116;
            border-color: rgba(0,0,0,.08);
        }

        .light-mode .member-row button {
            background: #eee;
            color: #111116;
        }

        .light-mode .poll-option-row {
            background: rgba(0,0,0,.06);
        }

        .light-mode .poll-option-fill {
            background: rgba(0,0,0,.09);
        }

        .light-mode .poll-option-btn {
            color: #111116;
        }
    </style>
</head>

<body>

<header class="topbar">
    <a href="index.html" class="logo">PIX<span>ORA</span></a>

    <div class="top-actions">
        <a href="index.html" class="auth-btn">🏠 Home</a>
        <a href="creators.html" class="auth-btn">Creators</a>
        <a href="account.html" class="auth-btn">Account</a>
    </div>
</header>

<main class="messages-page">

    <div class="messages-title">
        <h1>Messages</h1>
        <p>Private conversations between PIXORA creators.</p>
    </div>

    <section class="message-layout">

        <aside class="conversation-list">
            <div class="conversation-heading">
                <span>Conversations</span>
                <button type="button" id="newGroupBtn" class="heading-action">+ Group</button>
            </div>

            <div id="conversationList"></div>
        </aside>

        <section class="chat-panel">

            <div id="chatHeader" class="chat-header">
                Select a conversation
            </div>

            <div id="chatMessages" class="chat-messages">
                <div class="chat-empty">
                    Choose a creator conversation to start messaging.
                </div>
            </div>

            <div id="blockedBanner" class="blocked-banner" hidden>
                You blocked this person.
                <button type="button" id="bannerUnblock">Unblock</button>
            </div>

            <div id="chatStatus" class="chat-status"></div>
            <div id="typingStatus" class="typing-status"></div>

            <form id="messageForm" class="chat-form">

                <input
                    id="messageInput"
                    type="text"
                    maxlength="2000"
                    placeholder="Write a message..."
                    autocomplete="off"
                >

                <button
                    type="button"
                    id="attachBtn"
                    class="mic-btn"
                    aria-label="Attach a file"
                    title="Attach file"
                >📎</button>

                <button
                    type="button"
                    id="pollBtn"
                    class="mic-btn"
                    aria-label="Create a poll"
                    title="Create poll"
                >📊</button>

                <button
                    type="button"
                    id="micBtn"
                    class="mic-btn"
                    aria-label="Record a voice message"
                    title="Voice message"
                >🎤</button>

                <button type="submit" id="sendBtn">
                    Send
                </button>

                <div id="recordControls" class="record-controls" hidden>
                    <span class="record-dot"></span>
                    <span class="record-time" id="recordTime">0:00</span>
                    <button type="button" id="recordCancel" class="record-cancel">Cancel</button>
                    <button type="button" id="recordSend">Send</button>
                </div>

            </form>

        </section>

    </section>

</main>

<input type="file" id="fileInput" hidden>

<!-- New Group Modal -->
<div id="groupModal" class="pixora-modal" hidden>
    <div class="pixora-modal-backdrop" data-close></div>
    <div class="pixora-modal-panel">
        <button type="button" class="pixora-modal-close" data-close aria-label="Close">×</button>
        <h2>New Group</h2>

        <input type="text" id="groupNameInput" placeholder="Group name" maxlength="60">

        <div id="groupSelectedMembers" class="member-chips"></div>

        <input type="text" id="groupMemberSearch" placeholder="Search by username...">
        <div id="groupMemberResults" class="member-results"></div>

        <button type="button" id="groupCreateBtn" class="pixora-modal-main">Create Group</button>
        <p id="groupModalStatus" class="pixora-modal-status"></p>
    </div>
</div>

<!-- Manage Group Modal -->
<div id="manageModal" class="pixora-modal" hidden>
    <div class="pixora-modal-backdrop" data-close></div>
    <div class="pixora-modal-panel">
        <button type="button" class="pixora-modal-close" data-close aria-label="Close">×</button>
        <h2>Manage Group</h2>

        <div id="manageRenameRow" hidden>
            <input type="text" id="manageNameInput" maxlength="60">
            <button type="button" id="manageRenameBtn" class="pixora-modal-main">Save name</button>
        </div>

        <h3>Members</h3>
        <div id="manageMembersList" class="member-results"></div>

        <div id="manageAddSection" hidden>
            <h3>Add member</h3>
            <input type="text" id="manageAddSearch" placeholder="Search by username...">
            <div id="manageAddResults" class="member-results"></div>
        </div>

        <button type="button" id="manageLeaveBtn" class="pixora-modal-danger">Leave group</button>
        <p id="manageModalStatus" class="pixora-modal-status"></p>
    </div>
</div>

<!-- Poll Modal -->
<div id="pollModal" class="pixora-modal" hidden>
    <div class="pixora-modal-backdrop" data-close></div>
    <div class="pixora-modal-panel">
        <button type="button" class="pixora-modal-close" data-close aria-label="Close">×</button>
        <h2>Create Poll</h2>

        <input type="text" id="pollQuestionInput" placeholder="Ask a question..." maxlength="200">

        <div id="pollOptionsList"></div>
        <button type="button" id="pollAddOption">+ Add option</button>

        <label><input type="checkbox" id="pollAllowMultiple"> Allow multiple answers</label>
        <label><input type="checkbox" id="pollHideResults"> Hide results until closed</label>

        <button type="button" id="pollCreateBtn" class="pixora-modal-main">Create Poll</button>
        <p id="pollModalStatus" class="pixora-modal-status"></p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>

<script>
document.addEventListener("DOMContentLoaded", async () => {

    const supabase = window.pixoraSupabase;

    if (!supabase) return;

    if (localStorage.getItem("pixoraTheme") === "light") {
        document.body.classList.add("light-mode");
    }

    const $ = id => document.getElementById(id);

    const conversationList = $("conversationList");
    const chatMessages = $("chatMessages");
    const chatHeader = $("chatHeader");
    const messageForm = $("messageForm");
    const messageInput = $("messageInput");
    const chatStatus = $("chatStatus");
    const typingStatus = $("typingStatus");

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g,"&amp;")
            .replace(/</g,"&lt;")
            .replace(/>/g,"&gt;")
            .replace(/"/g,"&quot;")
            .replace(/'/g,"&#039;");
    }

    function fileSafeName(name) {
        return String(name || "file")
            .replace(/[^a-zA-Z0-9._-]/g, "-")
            .slice(0, 120);
    }

    function formatFileSize(bytes) {
        const n = Number(bytes || 0);

        if (n < 1024) return n + " B";
        if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";

        return (n / (1024 * 1024)).toFixed(1) + " MB";
    }

    const { data: sessionData } =
        await supabase.auth.getSession();

    const me = sessionData.session?.user;

    if (!me) {
        location.href = "login.html";
        return;
    }

    let conversations = [];
    let active = null;
    let blockedByMe = false;
    let activeMembers = [];
    let activeRole = null;

    let refreshTimer = null;
    let typingTimer = null;
    let typingActive = false;
    let presenceTimer = null;

    let realtimeChannel = null;

    /* =====================================================
       HELPERS
       ===================================================== */

    function displayName(profile) {
        return profile?.display_name ||
               profile?.username ||
               "PIXORA Creator";
    }

    function avatarHtml(profile) {

        const name = displayName(profile);

        const inner = profile?.avatar_url
            ? `<img src="${escapeHtml(profile.avatar_url)}" alt="">`
            : escapeHtml(name.charAt(0).toUpperCase());

        return `<span class="mini-avatar">${inner}</span>`;
    }

    function formatSeconds(total) {

        const seconds =
            Math.max(0, Math.round(total || 0));

        return Math.floor(seconds / 60) +
            ":" +
            String(seconds % 60).padStart(2,"0");
    }

    function previewText(message) {

        if (!message) return "No messages yet.";

        if (message.deleted_at) {
            return "This message was deleted";
        }

        if (message.kind === "audio") {
            return "🎤 Voice message";
        }

        if (message.kind === "file") {
            return "📎 " + (message.label || "File");
        }

        if (message.kind === "poll") {
            return "📊 " + (message.label || "Poll");
        }

        return message.body || "";
    }

    function setStatus(text) {
        chatStatus.textContent = text || "";
    }

    function setTypingStatus(text) {
        typingStatus.textContent = text || "";
    }

    function scheduleListRefresh() {

        clearTimeout(refreshTimer);

        refreshTimer =
            setTimeout(loadConversations, 500);
    }

    async function searchProfiles(term, excludeIds) {

        const query = String(term || "").trim();

        if (!query) return [];

        const exclude = new Set([me.id, ...(excludeIds || [])]);

        const { data, error } =
            await supabase
                .from("profiles")
                .select("user_id,username,display_name,avatar_url")
                .ilike("username", "%" + query + "%")
                .limit(15);

        if (error) {
            console.error("searchProfiles:", error);
            return [];
        }

        return (data || []).filter(row => !exclude.has(row.user_id));
    }

    /* =====================================================
       CONVERSATION LIST
       ===================================================== */

    async function loadConversations() {

        const { data, error } =
            await supabase.rpc("get_my_conversations");

        if (error) {

            console.error("get_my_conversations:", error);

            await loadConversationsFallback();

            return;
        }

        const rows = data || [];

        conversations =
            rows.map(row => ({
                id: row.conversation_id,
                otherId: row.other_user_id,
                profile: {
                    user_id: row.other_user_id,
                    username: row.username,
                    display_name: row.display_name,
                    avatar_url: row.avatar_url
                },
                latest: row.last_created_at
                    ? {
                        body: row.last_body,
                        kind: row.last_kind || "text",
                        created_at: row.last_created_at,
                        sender_id: row.last_sender_id,
                        deleted_at: row.last_deleted || false,
                        label: row.last_label
                    }
                    : null,
                unreadCount: Number(row.unread_count || 0),
                isGroup: !!row.is_group,
                conversationName: row.group_name || null,
                memberCount: Number(row.member_count || 0)
            }));

        if (active) {

            const fresh =
                conversations.find(
                    item =>
                        String(item.id) === String(active.id)
                );

            if (fresh) {
                active = fresh;
            }
        }

        renderConversationList();
    }

    async function loadConversationsFallback() {

        const { data: memberships, error } =
            await supabase
                .from("conversation_members")
                .select("conversation_id,last_read_at")
                .eq("user_id", me.id);

        if (error) {
            console.error(error);
            return;
        }

        const ids =
            (memberships || [])
                .map(item => item.conversation_id);

        if (!ids.length) {

            conversations = [];

            renderConversationList();

            return;
        }

        const { data: convRows } =
            await supabase
                .from("conversations")
                .select("id,is_group,name")
                .in("id", ids);

        const conversationMap = {};

        (convRows || []).forEach(row => {
            conversationMap[row.id] = row;
        });

        const { data: others } =
            await supabase
                .from("conversation_members")
                .select("conversation_id,user_id")
                .in("conversation_id", ids)
                .neq("user_id", me.id);

        const otherByConversation = {};

        (others || []).forEach(item => {

            if (!otherByConversation[item.conversation_id]) {
                otherByConversation[item.conversation_id] =
                    item.user_id;
            }
        });

        const otherIds =
            [...new Set(Object.values(otherByConversation))];

        const profiles = {};

        if (otherIds.length) {

            const { data: profileRows } =
                await supabase
                    .from("profiles")
                    .select(
                        "user_id,username,display_name,avatar_url"
                    )
                    .in("user_id", otherIds);

            (profileRows || []).forEach(row => {
                profiles[row.user_id] = row;
            });
        }

        const latestResults =
            await Promise.all(
                ids.map(id =>
                    supabase
                        .from("messages")
                        .select(
                            "id,body,kind,sender_id,created_at,deleted_at"
                        )
                        .eq("conversation_id", id)
                        .order("created_at", {
                            ascending:false
                        })
                        .limit(1)
                        .maybeSingle()
                )
            );

        const unreadResults =
            await Promise.all(
                memberships.map(member =>
                    supabase
                        .from("messages")
                        .select(
                            "id",
                            { count:"exact", head:true }
                        )
                        .eq(
                            "conversation_id",
                            member.conversation_id
                        )
                        .neq("sender_id", me.id)
                        .gt(
                            "created_at",
                            member.last_read_at
                        )
                )
            );

        conversations =
            ids
                .map((id,index) => {

                    const conv =
                        conversationMap[id] || {};

                    const otherId =
                        otherByConversation[id];

                    const latest =
                        latestResults[index]?.data || null;

                    const membershipIndex =
                        memberships.findIndex(
                            item =>
                                String(item.conversation_id) ===
                                String(id)
                        );

                    return {
                        id,
                        otherId,
                        profile:
                            profiles[otherId] || null,
                        latest,
                        unreadCount:
                            unreadResults[membershipIndex]?.count || 0,
                        isGroup: !!conv.is_group,
                        conversationName:
                            conv.name || null
                    };
                })
                .filter(item => item.isGroup || item.otherId)
                .sort((a,b) => {

                    const aTime =
                        a.latest
                            ? new Date(a.latest.created_at).getTime()
                            : 0;

                    const bTime =
                        b.latest
                            ? new Date(b.latest.created_at).getTime()
                            : 0;

                    return bTime - aTime;
                });

        renderConversationList();
    }

    function renderConversationList() {

        conversationList.innerHTML = "";

        if (!conversations.length) {

            conversationList.innerHTML =
                `<div style="padding:17px;color:#777;font-size:12px">
                    No conversations yet.
                </div>`;

            return;
        }

        conversations.forEach(item => {

            const button =
                document.createElement("button");

            button.type = "button";

            button.className =
                "conversation-item" +
                (
                    active &&
                    String(active.id) === String(item.id)
                        ? " active"
                        : ""
                );

            const name =
                item.isGroup
                    ? (item.conversationName || "PIXORA Group")
                    : displayName(item.profile);

            const avatar =
                item.isGroup
                    ? `<span class="mini-avatar">👥</span>`
                    : avatarHtml(item.profile);

            button.innerHTML = `
                ${avatar}

                <span class="conversation-text">
                    <div class="conversation-user">
                        ${escapeHtml(name)}
                    </div>

                    <div class="conversation-preview">
                        ${escapeHtml(previewText(item.latest))}
                    </div>
                </span>

                ${
                    item.unreadCount > 0
                        ? `<span class="unread-badge">
                            ${item.unreadCount > 99 ? "99+" : item.unreadCount}
                           </span>`
                        : ""
                }
            `;

            button.addEventListener(
                "click",
                () => openConversation(item.id)
            );

            conversationList.appendChild(button);
        });
    }

    /* =====================================================
       BLOCK STATE
       ===================================================== */

    async function loadBlockState() {

        if (!active || active.isGroup) {

            blockedByMe = false;

            return;
        }

        const { data, error } =
            await supabase
                .from("blocks")
                .select("blocker_id")
                .eq("blocker_id", me.id)
                .eq("blocked_id", active.otherId)
                .maybeSingle();

        if (error) {
            console.error(error);
        }

        blockedByMe = !!data;
    }

    /* =====================================================
       PRESENCE
       ===================================================== */

    async function getOtherPresence() {

        if (!active || active.isGroup) {
            return false;
        }

        const { data } =
            await supabase
                .from("presence")
                .select("last_seen")
                .eq("user_id", active.otherId)
                .maybeSingle();

        if (!data?.last_seen) {
            return false;
        }

        const age =
            Date.now() -
            new Date(data.last_seen).getTime();

        return age < 60000;
    }

    async function touchMyPresence() {

        try {
            await supabase.rpc("touch_presence");
        } catch (error) {
            console.error("presence:", error);
        }
    }

    async function refreshPresence() {

        if (!active || active.isGroup) return;

        const online =
            await getOtherPresence();

        const dot =
            $("presenceDot");

        const text =
            $("presenceText");

        if (dot) {
            dot.classList.toggle("online", online);
        }

        if (text) {
            text.textContent =
                online
                    ? "Online"
                    : "Offline";
        }
    }

    /* =====================================================
       HEADER
       ===================================================== */

    function renderHeader() {

        if (!active) return;

        const name =
            active.isGroup
                ? (active.conversationName || "PIXORA Group")
                : displayName(active.profile);

        const avatar =
            active.isGroup
                ? `<span class="mini-avatar">👥</span>`
                : avatarHtml(active.profile);

        if (active.isGroup) {

            chatHeader.innerHTML = `
                <div class="chat-person">
                    ${avatar}

                    <span class="chat-person-wrap">
                        <span>${escapeHtml(name)}</span>
                        <span class="chat-presence">
                            ${active.memberCount || activeMembers.length || ""} members
                        </span>
                    </span>
                </div>

                <div class="chat-tools">
                    <button type="button" id="chatManage">Manage</button>
                </div>
            `;

            $("chatManage")
                ?.addEventListener("click", openManageModal);

            return;
        }

        chatHeader.innerHTML = `
            <a
                class="chat-person"
                href="creator.html?id=${encodeURIComponent(active.otherId)}"
            >
                ${avatar}

                <span class="chat-person-wrap">
                    <span>
                        ${escapeHtml(name)}
                    </span>

                    <span class="chat-presence">
                        <span
                            id="presenceDot"
                            class="presence-dot"
                        ></span>

                        <span id="presenceText">
                            Offline
                        </span>
                    </span>
                </span>
            </a>

            <div class="chat-tools">
                <button
                    type="button"
                    id="chatBlock"
                >
                    ${blockedByMe ? "Unblock" : "Block"}
                </button>

                <button
                    type="button"
                    id="chatReport"
                >
                    Report
                </button>
            </div>
        `;

        $("chatBlock")
            ?.addEventListener("click", toggleBlock);

        $("chatReport")
            ?.addEventListener("click", reportUser);

        refreshPresence();
    }

    function updateComposer() {

        const locked =
            !active || blockedByMe;

        messageForm.hidden =
            !active || blockedByMe;

        $("blockedBanner").hidden =
            !blockedByMe;

        messageInput.disabled =
            locked;
    }

    async function toggleBlock() {

        if (!active || active.isGroup) return;

        if (!blockedByMe) {

            if (
                !confirm(
                    "Block " +
                    displayName(active.profile) +
                    "? You won't be able to message each other."
                )
            ) {
                return;
            }

            const { error } =
                await supabase
                    .from("blocks")
                    .insert({
                        blocker_id: me.id,
                        blocked_id: active.otherId
                    });

            if (error && error.code !== "23505") {

                setStatus(
                    "Could not block. Try again."
                );

                return;
            }

            await supabase
                .from("follows")
                .delete()
                .eq("follower_id", me.id)
                .eq("following_id", active.otherId);

            blockedByMe = true;

        } else {

            const { error } =
                await supabase
                    .from("blocks")
                    .delete()
                    .eq("blocker_id", me.id)
                    .eq("blocked_id", active.otherId);

            if (error) {

                setStatus(
                    "Could not unblock. Try again."
                );

                return;
            }

            blockedByMe = false;
        }

        setStatus("");

        renderHeader();
        updateComposer();
    }

    async function reportUser() {

        if (!active || active.isGroup) return;

        const reason =
            (
                prompt(
                    "Why are you reporting " +
                    displayName(active.profile) +
                    "?"
                ) || ""
            ).trim();

        if (!reason) return;

        if (
            reason.length < 3 ||
            reason.length > 500
        ) {

            setStatus(
                "Please write between 3 and 500 characters."
            );

            return;
        }

        const { error } =
            await supabase
                .from("reports")
                .insert({
                    reporter_id: me.id,
                    reported_user_id: active.otherId,
                    reason
                });

        if (error) {

            console.error(error);

            setStatus(
                "Could not send the report. Try again."
            );

            return;
        }

        setStatus(
            "Thanks. Your report was sent to the PIXORA team."
        );
    }

    $("bannerUnblock")
        .addEventListener("click", toggleBlock);

    /* =====================================================
       NEW GROUP MODAL
       ===================================================== */

    const groupModal = $("groupModal");
    const groupSelected = new Map();

    function openGroupModal() {

        groupSelected.clear();

        $("groupNameInput").value = "";
        $("groupMemberSearch").value = "";
        $("groupMemberResults").innerHTML = "";
        $("groupModalStatus").textContent = "";

        renderGroupChips();

        groupModal.hidden = false;
    }

    function closeGroupModal() {
        groupModal.hidden = true;
    }

    function renderGroupChips() {

        const box = $("groupSelectedMembers");

        box.innerHTML = "";

        groupSelected.forEach((profile, id) => {

            const chip = document.createElement("span");
            chip.className = "member-chip";

            chip.innerHTML = `
                ${escapeHtml(displayName(profile))}
                <button type="button" aria-label="Remove">×</button>
            `;

            chip.querySelector("button")
                .addEventListener("click", () => {
                    groupSelected.delete(id);
                    renderGroupChips();
                });

            box.appendChild(chip);
        });
    }

    let groupSearchTimer = null;

    $("groupMemberSearch").addEventListener("input", event => {

        clearTimeout(groupSearchTimer);

        const value = event.target.value;

        groupSearchTimer = setTimeout(async () => {

            const results =
                await searchProfiles(value, [...groupSelected.keys()]);

            const box = $("groupMemberResults");

            box.innerHTML = "";

            results.forEach(profile => {

                const row = document.createElement("div");
                row.className = "member-row";

                row.innerHTML = `
                    ${avatarHtml(profile)}
                    <span class="member-name">${escapeHtml(displayName(profile))}</span>
                    <button type="button">Add</button>
                `;

                row.querySelector("button")
                    .addEventListener("click", () => {
                        groupSelected.set(profile.user_id, profile);
                        renderGroupChips();
                        row.remove();
                    });

                box.appendChild(row);
            });

        }, 300);
    });

    $("groupCreateBtn").addEventListener("click", async () => {

        const name = $("groupNameInput").value.trim();
        const status = $("groupModalStatus");

        if (!name) {
            status.textContent = "Give the group a name.";
            return;
        }

        if (!groupSelected.size) {
            status.textContent = "Add at least one member.";
            return;
        }

        status.textContent = "Creating group...";

        const { data, error } =
            await supabase.rpc("create_group", {
                p_name: name,
                p_member_ids: [...groupSelected.keys()]
            });

        if (error) {
            console.error("create_group:", error);
            status.textContent = "Could not create the group. Try again.";
            return;
        }

        closeGroupModal();

        await loadConversations();

        if (data) {
            await openConversation(data);
        }
    });

    $("newGroupBtn").addEventListener("click", openGroupModal);

    /* =====================================================
       MANAGE GROUP MODAL
       ===================================================== */

    const manageModal = $("manageModal");

    async function loadActiveMembers() {

        if (!active || !active.isGroup) {
            activeMembers = [];
            activeRole = null;
            return;
        }

        const { data: members, error } =
            await supabase
                .from("conversation_members")
                .select("user_id,role")
                .eq("conversation_id", active.id);

        if (error) {
            console.error("conversation_members:", error);
            activeMembers = [];
            return;
        }

        const ids = (members || []).map(m => m.user_id);

        let profiles = {};

        if (ids.length) {

            const { data: profileRows } =
                await supabase
                    .from("profiles")
                    .select("user_id,username,display_name,avatar_url")
                    .in("user_id", ids);

            (profileRows || []).forEach(row => {
                profiles[row.user_id] = row;
            });
        }

        activeMembers = (members || []).map(m => ({
            user_id: m.user_id,
            role: m.role,
            profile: profiles[m.user_id] || null
        }));

        const mine = activeMembers.find(m => m.user_id === me.id);

        activeRole = mine ? mine.role : null;
    }

    function renderManageMembers() {

        const list = $("manageMembersList");

        list.innerHTML = "";

        activeMembers.forEach(member => {

            const row = document.createElement("div");
            row.className = "member-row";

            const canRemove =
                activeRole === "admin" &&
                member.user_id !== me.id;

            row.innerHTML = `
                ${avatarHtml(member.profile)}
                <span class="member-name">
                    ${escapeHtml(displayName(member.profile))}
                    ${member.user_id === me.id ? " (you)" : ""}
                </span>
                <span class="member-role-badge">${escapeHtml(member.role)}</span>
                ${canRemove ? `<button type="button" class="remove-member">Remove</button>` : ""}
            `;

            row.querySelector(".remove-member")
                ?.addEventListener("click", () => removeMember(member.user_id));

            list.appendChild(row);
        });
    }

    async function removeMember(userId) {

        if (!confirm("Remove this member from the group?")) return;

        const { error } =
            await supabase.rpc("remove_group_member", {
                p_conversation_id: active.id,
                p_user_id: userId
            });

        if (error) {
            console.error("remove_group_member:", error);
            $("manageModalStatus").textContent = "Could not remove that member.";
            return;
        }

        await loadActiveMembers();
        renderManageMembers();
        scheduleListRefresh();
    }

    async function openManageModal() {

        if (!active || !active.isGroup) return;

        $("manageModalStatus").textContent = "";
        $("manageAddSearch").value = "";
        $("manageAddResults").innerHTML = "";

        await loadActiveMembers();

        const canRename = activeRole === "admin";

        $("manageRenameRow").hidden = !canRename;
        $("manageAddSection").hidden = !canRename;
        $("manageNameInput").value = active.conversationName || "";

        renderManageMembers();

        manageModal.hidden = false;
    }

    function closeManageModal() {
        manageModal.hidden = true;
    }

    $("manageRenameBtn").addEventListener("click", async () => {

        const name = $("manageNameInput").value.trim();

        if (!name) {
            $("manageModalStatus").textContent = "Group name can't be empty.";
            return;
        }

        const { error } =
            await supabase.rpc("rename_group", {
                p_conversation_id: active.id,
                p_name: name
            });

        if (error) {
            console.error("rename_group:", error);
            $("manageModalStatus").textContent = "Could not rename the group.";
            return;
        }

        active.conversationName = name;

        renderHeader();
        renderConversationList();

        $("manageModalStatus").textContent = "Group renamed.";
    });

    let manageSearchTimer = null;

    $("manageAddSearch").addEventListener("input", event => {

        clearTimeout(manageSearchTimer);

        const value = event.target.value;

        manageSearchTimer = setTimeout(async () => {

            const existingIds = activeMembers.map(m => m.user_id);
            const results = await searchProfiles(value, existingIds);

            const box = $("manageAddResults");

            box.innerHTML = "";

            results.forEach(profile => {

                const row = document.createElement("div");
                row.className = "member-row";

                row.innerHTML = `
                    ${avatarHtml(profile)}
                    <span class="member-name">${escapeHtml(displayName(profile))}</span>
                    <button type="button">Add</button>
                `;

                row.querySelector("button")
                    .addEventListener("click", async () => {

                        const { error } =
                            await supabase.rpc("add_group_members", {
                                p_conversation_id: active.id,
                                p_member_ids: [profile.user_id]
                            });

                        if (error) {
                            console.error("add_group_members:", error);
                            $("manageModalStatus").textContent = "Could not add that member.";
                            return;
                        }

                        await loadActiveMembers();
                        renderManageMembers();
                        scheduleListRefresh();

                        row.remove();
                    });

                box.appendChild(row);
            });

        }, 300);
    });

    $("manageLeaveBtn").addEventListener("click", async () => {

        if (!confirm("Leave this group?")) return;

        const { error } =
            await supabase.rpc("leave_group", {
                p_conversation_id: active.id
            });

        if (error) {
            console.error("leave_group:", error);
            $("manageModalStatus").textContent = "Could not leave the group.";
            return;

    /* =====================================================
       VOICE / FILE SIGNED URLS
       ===================================================== */

    async function signedUrlsFor(messages) {

        const urls = {};

        const voicePaths =
            messages
                .filter(item => item.kind === "audio" && item.audio_path)
                .map(item => item.audio_path);

        const filePaths =
            messages
                .filter(item => item.kind === "file" && item.file_path)
                .map(item => item.file_path);

        if (voicePaths.length) {

            const { data, error } =
                await supabase
                    .storage
                    .from("voice-messages")
                    .createSignedUrls(voicePaths, 3600);

            if (error) {
                console.error("Voice URLs:", error);
            } else {
                (data || []).forEach(item => {
                    if (item.signedUrl) {
                        urls["voice:" + item.path] = item.signedUrl;
                    }
                });
            }
        }

        if (filePaths.length) {

            const { data, error } =
                await supabase
                    .storage
                    .from("chat-files")
                    .createSignedUrls(filePaths, 3600);

            if (error) {
                console.error("File URLs:", error);
            } else {
                (data || []).forEach(item => {
                    if (item.signedUrl) {
                        urls["file:" + item.path] = item.signedUrl;
                    }
                });
            }
        }

        return urls;
    }

    /* =====================================================
       POLL DATA LOADING
       ===================================================== */

    async function loadPollDataFor(messageIds) {

        const pollsByMessage = {};

        if (!messageIds.length) return pollsByMessage;

        const { data: polls, error } =
            await supabase
                .from("polls")
                .select("id,message_id,question,allow_multiple,hide_results,closed_at,created_by")
                .in("message_id", messageIds);

        if (error) {
            console.error("polls:", error);
            return pollsByMessage;
        }

        if (!polls || !polls.length) return pollsByMessage;

        const pollIds = polls.map(p => p.id);

        const { data: options } =
            await supabase
                .from("poll_options")
                .select("id,poll_id,position,label")
                .in("poll_id", pollIds)
                .order("position", { ascending: true });

        const { data: results, error: resultsError } =
            await supabase.rpc("get_poll_results", { p_poll_ids: pollIds });

        if (resultsError) {
            console.error("get_poll_results:", resultsError);
        }

        const optionsByPoll = {};

        (options || []).forEach(option => {
            (optionsByPoll[option.poll_id] ||= []).push(option);
        });

        const resultsByPoll = {};

        (results || []).forEach(row => {

            resultsByPoll[row.poll_id] ||= {
                byOption: {},
                totalVoters: row.total_voters,
                isClosed: row.is_closed,
                hideResults: row.hide_results,
                voted: false
            };

            resultsByPoll[row.poll_id].byOption[row.option_id] = row.votes;

            if (row.voted) {
                resultsByPoll[row.poll_id].voted = true;
                (resultsByPoll[row.poll_id].votedOptions ||= new Set()).add(row.option_id);
            }
        });

        polls.forEach(poll => {

            pollsByMessage[poll.message_id] = {
                poll,
                options: optionsByPoll[poll.id] || [],
                results: resultsByPoll[poll.id] || {
                    byOption: {},
                    totalVoters: 0,
                    isClosed: !!poll.closed_at,
                    hideResults: poll.hide_results,
                    voted: false,
                    votedOptions: new Set()
                }
            };
        });

        return pollsByMessage;
    }

    async function deleteMessage(message) {

        if (!message) return;

        if (message.sender_id !== me.id) {

        if (message.deleted_at) {
            return;
        }

        if (
            !confirm(

        setStatus("Deleting message...");

            await supabase.rpc(
                "delete_message",
                {
                    p_message_id: message.id
                }
            );

        if (error) {

            console.error(
                "delete_message:",
                error
            );

            setStatus(
                error.code === "42501"
                    ? "You can only delete your own messages."
                    : "Could not delete the message. Try again."
            );

            return;
        }

        setStatus("");

        await loadMessages();

        scheduleListRefresh();
    }

    /* =====================================================
       MESSAGE RENDERING
       ===================================================== */

    function renderPollBubble(message, pollData) {

        const wrap = document.createElement("div");
        wrap.className = "poll-bubble";

        const { poll, options, results } = pollData;

        const isClosed = !!poll.closed_at;
        const votedOptions = results.votedOptions || new Set();
        const hasVoted = votedOptions.size > 0;

        const showCounts =
            !results.hideResults || hasVoted || isClosed || poll.created_by === me.id;

        const totalVotes =
            options.reduce(
                (sum, option) => sum + Number(results.byOption[option.id] || 0),
                0
            );

        let html = `<div class="poll-question">📊 ${escapeHtml(poll.question)}</div>`;

        options.forEach(option => {

            const votes = Number(results.byOption[option.id] || 0);
            const percent = totalVotes ? Math.round((votes / totalVotes) * 100) : 0;
            const voted = votedOptions.has(option.id);

            html += `
                <div class="poll-option-row" data-option-id="${option.id}">
                    ${showCounts ? `<div class="poll-option-fill" style="width:${percent}%"></div>` : ""}
                    <button type="button" class="poll-option-btn ${voted ? "voted-option" : ""}"
                            ${isClosed ? "disabled" : ""}>
                        <span>${voted ? "✓ " : ""}${escapeHtml(option.label)}</span>
                        ${showCounts ? `<span>${percent}% · ${votes}</span>` : ""}
                    </button>
                </div>
            `;
        });

        html += `
            <div class="poll-meta-row">
                <span>
                    ${isClosed ? "Poll closed" : (poll.allow_multiple ? "Pick one or more" : "Pick one")}
                    ${!results.hideResults || isClosed ? " · " + totalVotes + " votes" : ""}
                </span>
                ${
                    !isClosed && poll.created_by === me.id
                        ? `<button type="button" class="poll-close-btn">Close poll</button>`
                        : ""
                }
            </div>
        `;

        wrap.innerHTML = html;

        if (!isClosed) {

            wrap.querySelectorAll(".poll-option-btn").forEach((button, index) => {

                button.addEventListener("click", async event => {

                    event.stopPropagation();

                    const option = options[index];

                    let chosen;

                    if (poll.allow_multiple) {

                        const next = new Set(votedOptions);

                        if (next.has(option.id)) {
                            next.delete(option.id);
                        } else {
                            next.add(option.id);
                        }

                        chosen = [...next];

                    } else {

                        chosen = [option.id];
                    }

                    const { error } =
                        await supabase.rpc("vote_poll", {
                            p_poll_id: poll.id,
                            p_option_ids: chosen
                        });

                    if (error) {
                        console.error("vote_poll:", error);
                        setStatus("Could not record your vote.");
                        return;
                    }

                    setStatus("");

                    await loadMessages();
                });
            });
        }

        wrap.querySelector(".poll-close-btn")
            ?.addEventListener("click", async event => {

                event.stopPropagation();

                if (!confirm("Close this poll? No more votes will be accepted.")) return;

                const { error } =
                    await supabase.rpc("close_poll", { p_poll_id: poll.id });

                if (error) {
                    console.error("close_poll:", error);
                    setStatus("Could not close the poll.");
                    return;
                }

                await loadMessages();
            });

        return wrap;
    }

    function renderFileBubble(message, urls) {

        const wrap = document.createElement("div");

        const url = urls["file:" + message.file_path];
        const isImage = (message.file_mime || "").startsWith("image/");

        if (isImage && url) {

            wrap.innerHTML = `<img class="image-attachment" src="${escapeHtml(url)}" alt="${escapeHtml(message.file_name || "attachment")}">`;

            wrap.querySelector("img")
                .addEventListener("click", event => {
                    event.stopPropagation();
                    window.open(url, "_blank", "noopener");
                });

            return wrap;
        }

        wrap.className = "file-bubble";

        wrap.innerHTML = `
            <span class="file-icon">📄</span>
            <span class="file-meta">
                <div class="file-name">${escapeHtml(message.file_name || "File")}</div>
                <div class="file-size">${escapeHtml(formatFileSize(message.file_size))}</div>
            </span>
            ${
                url
                    ? `<a class="file-download" href="${escapeHtml(url)}" target="_blank" rel="noopener" download="${escapeHtml(fileSafeName(message.file_name || "file"))}">Download</a>`
                    : `<span class="file-download">Unavailable</span>`
            }
        `;

        return wrap;
    }

    function renderMessage(message, urls, pollsByMessage) {

        const row =
            document.createElement("div");

        const mine =
            message.sender_id === me.id;

        row.className =
            "message-row" +
            (mine ? " mine" : "");

        row.dataset.messageId =
            message.id;

        const bubble =
            document.createElement("div");

        bubble.className =
            "message-bubble";

        const time =
            new Date(message.created_at)
                .toLocaleTimeString(
                    [],
                    {
                        hour:"2-digit",
                        minute:"2-digit"
                    }
                );

        if (message.deleted_at) {

            bubble.classList.add("deleted");

            bubble.innerHTML = `
                <div>
                    ${
                        mine
                            ? "You deleted this message"
                            : "This message was deleted"
                    }
                </div>

                <div class="message-time">
                    ${escapeHtml(time)}
                </div>
            `;

            row.appendChild(bubble);

            chatMessages.appendChild(row);

            return;
        }

        if (message.kind === "poll") {

            const pollData = pollsByMessage && pollsByMessage[message.id];

            if (pollData) {
                bubble.appendChild(renderPollBubble(message, pollData));
            } else {
                bubble.innerHTML = `<div>📊 Poll</div>`;
            }

            const timeEl = document.createElement("div");
            timeEl.className = "message-time";
            timeEl.textContent = time;
            bubble.appendChild(timeEl);

            row.appendChild(bubble);
            chatMessages.appendChild(row);

            return;
        }

        if (message.kind === "file") {

            bubble.appendChild(renderFileBubble(message, urls));

            const meta = document.createElement("div");
            meta.className = "message-meta";
            meta.innerHTML = `<span class="message-time">${escapeHtml(time)}</span>`;
            bubble.appendChild(meta);

            row.appendChild(bubble);
            chatMessages.appendChild(row);

            return;
        }

        let content;

        if (message.kind === "audio") {

            const url =
                urls["voice:" + message.audio_path];

            content = `
                <div class="voice-label">
                    🎤 Voice message ·
                    ${escapeHtml(
                        formatSeconds(
                            message.audio_seconds
                        )
                    )}
                </div>

                ${
                    url
                        ? `
                            <audio
                                controls
                                preload="metadata"
                                src="${escapeHtml(url)}"
                            ></audio>
                          `
                        : `
                            <div class="voice-label">
                                Could not load this voice message.
                            </div>
                          `
                }
            `;

        } else {

            content =
                `<div>${escapeHtml(message.body)}</div>`;
        }

        let seenText = "";

        if (mine) {

            seenText =
                message.read_at
                    ? "✓✓ Seen"
                    : "✓ Sent";
        }

        bubble.innerHTML = `
            ${content}

            <div class="message-meta">
                <span class="message-time">
                    ${escapeHtml(time)}
                </span>

                ${
                    mine
                        ? `
                            <span class="seen-mark">
                                ${escapeHtml(seenText)}
                            </span>
                          `
                        : ""
                }
            </div>
        `;

        if (mine) {

            const actions =
                document.createElement("div");

            actions.className =
                "message-actions";

            actions.innerHTML = `
                <button
                    type="button"
                    class="delete-action"
                >
                    Delete
                </button>
            `;

            actions
                .querySelector(".delete-action")
                .addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();

                        deleteMessage(message);
                    }
                );

            bubble.appendChild(actions);
        }

        row.appendChild(bubble);

        row.addEventListener(
            "click",
            event => {

                if (
                    event.target.closest(
                        ".message-actions"
                    )
                ) {
                    return;
                }

                document
                    .querySelectorAll(
                        ".message-row.selected"
                    )
                    .forEach(item => {

                        if (item !== row) {
                            item.classList.remove(
                                "selected"
                            );
                        }
                    });

                row.classList.toggle(
                    "selected"
                );
            }
        );

        chatMessages.appendChild(row);
    }

    async function markConversationRead() {

        if (!active) return;

        const { error } =
            await supabase.rpc(
                "mark_conversation_read",
                {
                    p_conversation_id:
                        active.id
                }

    /* =====================================================
       LOAD MESSAGES
       ===================================================== */

    async function loadMessages() {

        if (!active) return;

        const conversationId =
            active.id;

        const { data, error } =
            await supabase
                .from("messages")
                .select(
                    "id,sender_id,body,created_at,read_at,kind,audio_path,audio_seconds,deleted_at,forwarded,file_path,file_name,file_size,file_mime"
                )
                .eq(
                    "conversation_id",
                    conversationId
                )
                .order(
                    "created_at",
                    {
                        ascending:true
                    }
                );

        if (error) {

            console.error(error);

            chatMessages.innerHTML =
                `<div class="chat-empty">
                    Could not load messages.
                </div>`;

            return;
        }

        if (
            !active ||
            String(active.id) !==
            String(conversationId)
        ) {
            return;
        }

        chatMessages.innerHTML = "";

        if (!data?.length) {

            chatMessages.innerHTML =
                `<div class="chat-empty">
                    No messages yet. Say hello 👋
                </div>`;

        } else {

            const pollMessageIds =
                data
                    .filter(m => m.kind === "poll" && !m.deleted_at)
                    .map(m => m.id);

            const [urls, pollsByMessage] =
                await Promise.all([
                    signedUrlsFor(data),
                    loadPollDataFor(pollMessageIds)
                ]);

            data.forEach(
                message =>
                    renderMessage(
                        message,
                        urls,
                        pollsByMessage
                    )
            );

            chatMessages.scrollTop =
                chatMessages.scrollHeight;
        }

        await markConversationRead();
    }

       ===================================================== */

    async function openConversation(id) {

        let conversation =
            conversations.find(
                item =>
                    String(item.id) ===
                    String(id)
            );

        if (!conversation) {

            await loadConversations();

            conversation =
                conversations.find(
                    item =>
                        String(item.id) ===
                        String(id)
                );
        }

        if (!conversation) {

            chatHeader.textContent =
                "Conversation not found";

            chatMessages.innerHTML =
                `<div class="chat-empty">
                    This conversation doesn't exist
                    or you're not part of it.
                </div>`;

            return;
        }

        cancelRecordingSilently();

        active = conversation;

        blockedByMe = false;

        setStatus("");
        setTypingStatus("");

        renderConversationList();

        renderHeader();

        await loadBlockState();

        renderHeader();

        updateComposer();

        await loadMessages();

        await refreshPresence();

        startPresenceRefresh();
    }

            error &&
            (
                error.code === "42501" ||
                /row-level security/i.test(
                    error.message || ""
                )
            )
        ) {

            return (

                "in this conversation."

            "Message could not be sent. Try again."

    /* =====================================================

       ===================================================== */

    const fileInput = $("fileInput");

    $("attachBtn").addEventListener("click", () => {

        if (!active || blockedByMe) return;

        fileInput.click();
    });

    fileInput.addEventListener("change", async () => {

        const file = fileInput.files?.[0];

        fileInput.value = "";

        if (!file || !active || blockedByMe) return;

        const MAX_SIZE = 26214400;

        if (file.size > MAX_SIZE) {
            setStatus("That file is too large (25 MB max).");
            return;
        }

        setStatus("Uploading " + file.name + "...");

        const path =
            active.id + "/" + me.id + "/" +
            Date.now() + "-" + fileSafeName(file.name);

        const upload =
            await supabase
                .storage
                .from("chat-files")
                .upload(path, file, {
                    contentType: file.type || "application/octet-stream"
                });

        if (upload.error) {

            console.error("chat-files upload:", upload.error);

            setStatus(
                /mime type|not allowed/i.test(upload.error.message || "")
                    ? "That file type isn't supported."
                    : "Could not upload the file. Try again."
            );

            return;
        }

        const insert =
            await supabase
                .from("messages")
                .insert({
                    conversation_id: active.id,
                    sender_id: me.id,
                    body: "",
                    kind: "file",
                    file_path: path,
                    file_name: file.name,
                    file_size: file.size,
                    file_mime: file.type || "application/octet-stream"
                });

        if (insert.error) {

            console.error("file message insert:", insert.error);

            await supabase.storage.from("chat-files").remove([path]);

            setStatus(sendErrorText(insert.error));

            return;
        }

        setStatus("");

        await loadMessages();

        scheduleListRefresh();
    });

                .map(input => input.value.trim())
                .filter(Boolean);
