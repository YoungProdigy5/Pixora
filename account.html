<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PIXORA — My Account</title>

    <link rel="stylesheet" href="style.css?v=5">

    <style>
        .account-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 35px 20px 100px;
        }

        .account-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 22px;
            padding: 25px;
            margin-bottom: 25px;
            backdrop-filter: blur(12px);
        }

        .account-header {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 25px;
        }

        .account-avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg,#ff1744,#7c3aed);
            font-size: 30px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .account-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .account-header h1 {
            margin: 0 0 5px;
        }

        .account-header p {
            margin: 0;
            opacity: .65;
        }

        .account-buttons {
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 12px;
        }

        .account-buttons a,
        .account-buttons button {
            width: 100%;
            min-height: 48px;
        }

        .account-stats {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 15px;
        }

        .account-stat {
            padding: 20px;
            border-radius: 16px;
            background: rgba(255,255,255,0.04);
            text-align: center;
        }

        .account-stat strong {
            display: block;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .account-stat span {
            opacity: .65;
            font-size: 13px;
        }

        .upload-panel {
            display: none;
            margin-top: 20px;
        }

        .upload-panel.active {
            display: block;
        }

        .upload-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .upload-tab {
            flex: 1;
            padding: 13px;
            border: 0;
            border-radius: 12px;
            background: rgba(255,255,255,.07);
            color: inherit;
            cursor: pointer;
        }

        .upload-tab.active {
            background: linear-gradient(135deg,#ff1744,#7c3aed);
            color: white;
        }

        .upload-form {
            display: none;
        }

        .upload-form.active {
            display: block;
        }

        .upload-form label {
            display: block;
            margin: 15px 0 7px;
            font-size: 14px;
        }

        .upload-form input,
        .upload-form select {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,.1);
            background: rgba(255,255,255,.06);
            color: inherit;
        }

        .upload-form input[type="file"] {
            padding: 10px;
        }

        .rights-check {
            display: flex !important;
            align-items: center;
            gap: 8px;
        }

        .rights-check input {
            width: auto;
        }

        .upload-message {
            margin-top: 12px;
            font-size: 14px;
        }

        .uploads-grid {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 15px;
        }

        .upload-item {
            overflow: hidden;
            border-radius: 16px;
            background: rgba(255,255,255,.04);
        }

        .upload-item-media {
            height: 170px;
            background: rgba(0,0,0,.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .upload-item-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .upload-item-info {
            padding: 13px;
        }

        .upload-item-info h3 {
            margin: 0 0 7px;
            font-size: 16px;
        }

        .upload-item-info p {
            margin: 0;
            opacity: .6;
            font-size: 12px;
        }

        .empty-account {
            text-align: center;
            padding: 40px 20px;
            opacity: .6;
        }

        @media(max-width:700px) {
            .account-buttons,
            .account-stats,
            .uploads-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header class="topbar">

    <a href="index.html" class="logo">
        PIX<span>ORA</span>
    </a>

    <div class="top-actions">

        <a href="creators.html" class="auth-btn">
            👥 Creators
        </a>

        <a href="messages.html" class="auth-btn">
            💬 Messages
        </a>

        <button
            id="themeToggle"
            class="theme-toggle"
            type="button"
            aria-label="Toggle theme"
        >
            <span class="theme-sun">☀️</span>
            <span class="theme-moon">🌙</span>
            <span class="theme-knob"></span>
        </button>

    </div>

</header>


<main class="account-page">

    <div class="section-heading">
        <div>
            <span class="section-label">YOUR PIXORA</span>
            <h2>My Account</h2>
        </div>
    </div>


    <!-- PROFILE -->

    <section class="account-card">

        <div class="account-header">

            <div
                class="account-avatar"
                id="accountAvatar"
            >
                👤
            </div>

            <div>

                <h1 id="accountName">
                    Loading...
                </h1>

                <p id="accountEmail">
                    Loading...
                </p>

            </div>

        </div>


        <div class="account-buttons">

            <a
                href="creators.html"
                class="primary-btn"
            >
                👥 Creators
            </a>

            <a
                href="messages.html"
                class="primary-btn"
            >
                💬 Messages
            </a>

            <button
                id="openWallpaperUpload"
                class="primary-btn"
                type="button"
            >
                🖼️ Upload Wallpaper
            </button>

            <button
                id="openVideoUpload"
                class="primary-btn"
                type="button"
            >
                🎬 Upload Video
            </button>

            <button
                id="logoutButton"
                class="secondary-btn"
                type="button"
            >
                Logout
            </button>

        </div>

    </section>


    <!-- STATISTICS -->

    <section class="account-card">

        <div class="section-heading">

            <div>
                <span class="section-label">
                    YOUR NUMBERS
                </span>

                <h2>
                    Statistics
                </h2>
            </div>

        </div>


        <div
            class="account-stats"
            id="accountStats"
        >

            <div class="account-stat">
                <strong>0</strong>
                <span>Total Uploads</span>
            </div>

            <div class="account-stat">
                <strong>0</strong>
                <span>Total Views</span>
            </div>

            <div class="account-stat">
                <strong>0</strong>
                <span>Total Downloads</span>
            </div>

        </div>

    </section>


    <!-- UPLOAD AREA -->

    <section
        class="account-card upload-panel"
        id="uploadPanel"
    >

        <div class="upload-tabs">

            <button
                id="wallpaperTab"
                class="upload-tab active"
                type="button"
            >
                🖼️ Wallpaper
            </button>

            <button
                id="videoTab"
                class="upload-tab"
                type="button"
            >
                🎬 Video
            </button>

        </div>


        <!-- WALLPAPER FORM -->

        <form
            id="wallpaperForm"
            class="upload-form active"
        >

            <h2>
                Upload Wallpaper
            </h2>

            <label for="wallpaperTitle">
                Title
            </label>

            <input
                id="wallpaperTitle"
                type="text"
                maxlength="100"
                required
            >


            <label for="wallpaperCategory">
                Category
            </label>

            <select
                id="wallpaperCategory"
                required
            >

                <option value="">
                    Choose category
                </option>

            </select>


            <label for="wallpaperTags">
                Tags
            </label>

            <input
                id="wallpaperTags"
                type="text"
                placeholder="gaming, anime, dark..."
            >


            <label for="wallpaperFile">
                Wallpaper
            </label>

            <input
                id="wallpaperFile"
                type="file"
                accept="image/jpeg,image/png,image/webp,image/avif"
                required
            >


            <label class="rights-check">

                <input
                    id="wallpaperRights"
                    type="checkbox"
                    required
                >

                <span>
                    I own this wallpaper or have permission to upload it.
                </span>

            </label>


            <button
                class="primary-btn"
                type="submit"
            >
                Upload Wallpaper
            </button>


            <p
                id="wallpaperMessage"
                class="upload-message"
            ></p>

        </form>


        <!-- VIDEO FORM -->

        <form
            id="videoForm"
            class="upload-form"
        >

            <h2>
                Upload Video
            </h2>


            <label for="videoTitle">
                Title
            </label>

            <input
                id="videoTitle"
                type="text"
                maxlength="100"
                required
            >


            <label for="videoCategory">
                Category
            </label>

            <select
                id="videoCategory"
                required
            >

                <option value="">
                    Choose category
                </option>

            </select>


            <label for="videoTags">
                Tags
            </label>

            <input
                id="videoTags"
                type="text"
                placeholder="gaming, funny, edit..."
            >


            <label for="videoThumbnail">
                Thumbnail
            </label>

            <input
                id="videoThumbnail"
                type="file"
                accept="image/jpeg,image/png,image/webp"
            >


            <label for="videoFile">
                Video
            </label>

            <input
                id="videoFile"
                type="file"
                accept="video/mp4,video/webm,video/quicktime"
                required
            >


            <label class="rights-check">

                <input
                    id="videoRights"
                    type="checkbox"
                    required
                >

                <span>
                    I own this video or have permission to upload it.
                </span>

            </label>


            <button
                class="primary-btn"
                type="submit"
            >
                Upload Video
            </button>


            <p
                id="videoMessage"
                class="upload-message"
            ></p>

        </form>

    </section>


    <!-- MY UPLOADS -->

    <section class="account-card">

        <div class="section-heading">

            <div>
                <span class="section-label">
                    YOUR CONTENT
                </span>

                <h2>
                    My Uploads
                </h2>
            </div>

        </div>


        <div
            id="myUploads"
            class="uploads-grid"
        ></div>


        <div
            id="emptyUploads"
            class="empty-account"
            hidden
        >

            <h3>
                No uploads yet
            </h3>

            <p>
                Your wallpapers and videos will appear here.
            </p>

        </div>

    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    async function () {

        const supabase = window.pixoraSupabase;

        if (!supabase) {
            alert("PIXORA Supabase connection is missing.");
            return;
        }


        const {
            data: {
                session
            }
        } = await supabase.auth.getSession();


        if (!session || !session.user) {

            window.location.href = "login.html";

            return;
        }


        const user = session.user;


        const $ = function (id) {
            return document.getElementById(id);
        };


        function escapeHTML(value) {

            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* THEME */

        const savedTheme =
            localStorage.getItem("pixoraTheme") || "dark";

        if (savedTheme === "light") {

            document.body.classList.add("light-mode");

        }


        $("themeToggle").addEventListener(
            "click",
            function () {

                document.body.classList.toggle("light-mode");

                localStorage.setItem(
                    "pixoraTheme",
                    document.body.classList.contains("light-mode")
                        ? "light"
                        : "dark"
                );

            }
        );


        /* PROFILE */

        const {
            data: profile
        } = await supabase
            .from("profiles")
            .select(
                "username,display_name,avatar_url"
            )
            .eq(
                "user_id",
                user.id
            )
            .maybeSingle();


        $("accountName").textContent =
            profile?.display_name ||
            profile?.username ||
            user.email?.split("@")[0] ||
            "PIXORA User";


        $("accountEmail").textContent =
            user.email || "";


        if (profile?.avatar_url) {

            $("accountAvatar").innerHTML =
                '<img src="' +
                escapeHTML(profile.avatar_url) +
                '" alt="Profile">';

        }


        /* CATEGORIES */

        const {
            data: categories
        } = await supabase
            .from("categories")
            .select("name")
            .order("name");


        [
            $("wallpaperCategory"),
            $("videoCategory")
        ].forEach(
            function (select) {

                (categories || []).forEach(
                    function (category) {

                        const option =
                            document.createElement("option");

                        option.value =
                            category.name;

                        option.textContent =
                            category.name;

                        select.appendChild(option);

                    }
                );

            }
        );


        /* STATISTICS */

        async function loadStatistics() {

            const wallpaperResult =
                await supabase
                    .from("wallpapers")
                    .select(
                        "views,downloads",
                        {
                            count: "exact"
                        }
                    )
                    .eq(
                        "user_id",
                        user.id
                    );


            const videoResult =
                await supabase
                    .from("videos")
                    .select(
                        "views,downloads",
                        {
                            count: "exact"
                        }
                    )
                    .eq(
                        "user_id",
                        user.id
                    );


            const wallpapers =
                wallpaperResult.data || [];

            const videos =
                videoResult.data || [];


            const all =
                wallpapers.concat(videos);


            let views = 0;
            let downloads = 0;


            all.forEach(
                function (item) {

                    views +=
                        Number(item.views || 0);

                    downloads +=
                        Number(item.downloads || 0);

                }
            );


            $("accountStats").innerHTML =

                '<div class="account-stat">' +
                '<strong>' +
                all.length +
                '</strong>' +
                '<span>Total Uploads</span>' +
                '</div>' +

                '<div class="account-stat">' +
                '<strong>' +
                views +
                '</strong>' +
                '<span>Total Views</span>' +
                '</div>' +

                '<div class="account-stat">' +
                '<strong>' +
                downloads +
                '</strong>' +
                '<span>Total Downloads</span>' +
                '</div>';

        }


        /* MY UPLOADS */

        async function loadUploads() {

            const wallpaperResult =
                await supabase
                    .from("wallpapers")
                    .select(
                        "title,status,views,downloads,created_at,image_url"
                    )
                    .eq(
                        "user_id",
                        user.id
                    )
                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    );


            const videoResult =
                await supabase
                    .from("videos")
                    .select(
                        "title,status,views,downloads,created_at,thumbnail_url"
                    )
                    .eq(
                        "user_id",
                        user.id
                    )
                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    );


            const wallpapers =
                (wallpaperResult.data || [])
                    .map(
                        function (item) {

                            return {
                                ...item,
                                type: "Wallpaper",
                                image:
                                    item.image_url
                            };

                        }
                    );


            const videos =
                (videoResult.data || [])
                    .map(
                        function (item) {

                            return {
                                ...item,
                                type: "Video",
                                image:
                                    item.thumbnail_url
                            };

                        }
                    );


            const uploads =
                wallpapers
                    .concat(videos)
                    .sort(
                        function (a,b) {

                            return new Date(b.created_at)
                                - new Date(a.created_at);

                        }
                    );


            $("myUploads").innerHTML = "";


            if (!uploads.length) {

                $("emptyUploads").hidden = false;

                return;

            }


            $("emptyUploads").hidden = true;


            uploads.forEach(
                function (item) {

                    const card =
                        document.createElement("article");

                    card.className =
                        "upload-item";


                    card.innerHTML =

                        '<div class="upload-item-media">' +

                        (
                            item.image

                                ? '<img src="' +
                                  escapeHTML(item.image) +
                                  '" alt="' +
                                  escapeHTML(item.title) +
                                  '">'

                                : (
                                    item.type === "Video"
                                        ? "🎬"
                                        : "🖼️"
                                  )
                        ) +

                        '</div>' +

                        '<div class="upload-item-info">' +

                        '<h3>' +
                        escapeHTML(item.title) +
                        '</h3>' +

                        '<p>' +
                        escapeHTML(item.type) +
                        ' • ' +
                        escapeHTML(item.status) +
                        ' • ' +
                        Number(item.views || 0) +
                        ' views • ' +
                        Number(item.downloads || 0) +
                        ' downloads' +
                        '</p>' +

                        '</div>';


                    $("myUploads")
                        .appendChild(card);

                }
            );

        }


        /* UPLOAD PANEL */

        function showUploadPanel(type) {

            $("uploadPanel")
                .classList.add("active");


            if (type === "wallpaper") {

                $("wallpaperTab")
                    .classList.add("active");

                $("videoTab")
                    .classList.remove("active");

                $("wallpaperForm")
                    .classList.add("active");

                $("videoForm")
                    .classList.remove("active");

            } else {

                $("videoTab")
                    .classList.add("active");

                $("wallpaperTab")
                    .classList.remove("active");

                $("videoForm")
                    .classList.add("active");

                $("wallpaperForm")
                    .classList.remove("active");

            }

        }


        $("openWallpaperUpload")
            .addEventListener(
                "click",
                function () {

                    showUploadPanel(
                        "wallpaper"
                    );

                }
            );


        $("openVideoUpload")
            .addEventListener(
                "click",
                function () {

                    showUploadPanel(
                        "video"
                    );

                }
            );


        $("wallpaperTab")
            .addEventListener(
                "click",
                function () {

                    showUploadPanel(
                        "wallpaper"
                    );

                }
            );


        $("videoTab")
            .addEventListener(
                "click",
                function () {

                    showUploadPanel(
                        "video"
                    );

                }
            );


        /* WALLPAPER UPLOAD */

        $("wallpaperForm")
            .addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();


                    const message =
                        $("wallpaperMessage");

                    message.textContent =
                        "Uploading...";


                    try {

                        const file =
                            $("wallpaperFile")
                                .files[0];


                        if (!file) {

                            throw new Error(
                                "Please select a wallpaper."
                            );

                        }


                        const safeName =
                            file.name.replace(
                                /[^a-zA-Z0-9._-]/g,
                                "_"
                            );


                        const path =
                            user.id +
                            "/" +
                            Date.now() +
                            "-" +
                            safeName;


                        const upload =
                            await supabase
                                .storage
                                .from("wallpapers")
                                .upload(
                                    path,
                                    file
                                );


                        if (upload.error) {

                            throw upload.error;

                        }


                        const imageURL =
                            supabase
                                .storage
                                .from("wallpapers")
                                .getPublicUrl(
                                    path
                                )
                                .data
                                .publicUrl;


                        const insert =
                            await supabase
                                .from("wallpapers")
                                .insert({

                                    title:
                                        $("wallpaperTitle")
                                            .value
                                            .trim(),

                                    category:
                                        $("wallpaperCategory")
                                            .value,

                                    tags:
                                        $("wallpaperTags")
                                            .value
                                            .trim(),

                                    image_url:
                                        imageURL,

                                    status:
                                        "pending",

                                    user_id:
                                        user.id

                                });


                        if (insert.error) {

                            throw insert.error;

                        }


                        message.textContent =
                            "Uploaded successfully. Waiting for approval.";


                        $("wallpaperForm")
                            .reset();


                        await loadStatistics();
                        await loadUploads();

                    } catch (error) {

                        message.textContent =
                            "Upload failed: " +
                            error.message;

                    }

                }
            );


        /* VIDEO UPLOAD */

        $("videoForm")
            .addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();


                    const message =
                        $("videoMessage");

                    message.textContent =
                        "Uploading...";


                    try {

                        const file =
                            $("videoFile")
                                .files[0];


                        if (!file) {

                            throw new Error(
                                "Please select a video."
                            );

                        }


                        const safeName =
                            file.name.replace(
                                /[^a-zA-Z0-9._-]/g,
                                "_"
                            );


                        const path =
                            user.id +
                            "/" +
                            Date.now() +
                            "-" +
                            safeName;


                        const upload =
                            await supabase
                                .storage
                                .from("videos")
                                .upload(
                                    path,
                                    file
                                );


                        if (upload.error) {

                            throw upload.error;

                        }


                        const videoURL =
                            supabase
                                .storage
                                .from("videos")
                                .getPublicUrl(
                                    path
                                )
                                .data
                                .publicUrl;


                        let thumbnailURL =
                            null;


                        const thumbnail =
                            $("videoThumbnail")
                                .files[0];


                        if (thumbnail) {

                            const thumbnailName =
                                thumbnail.name.replace(
                                    /[^a-zA-Z0-9._-]/g,
                                    "_"
                                );


                            const thumbnailPath =
                                user.id +
                                "/thumb-" +
                                Date.now() +
                                "-" +
                                thumbnailName;


                            const thumbnailUpload =
                                await supabase
                                    .storage
                                    .from("wallpapers")
                                    .upload(
                                        thumbnailPath,
                                        thumbnail
                                    );


                            if (
                                thumbnailUpload.error
                            ) {

                                throw thumbnailUpload.error;

                            }


                            thumbnailURL =
                                supabase
                                    .storage
                                    .from("wallpapers")
                                    .getPublicUrl(
                                        thumbnailPath
                                    )
                                    .data
                                    .publicUrl;

                        }


                        const insert =
                            await supabase
                                .from("videos")
                                .insert({

                                    title:
                                        $("videoTitle")
                                            .value
                                            .trim(),

                                    category:
                                        $("videoCategory")
                                            .value,

                                    tags:
                                        $("videoTags")
                                            .value
                                            .trim(),

                                    video_url:
                                        videoURL,

                                    thumbnail_url:
                                        thumbnailURL,

                                    status:
                                        "pending",

                                    user_id:
                                        user.id

                                });


                        if (insert.error) {

                            throw insert.error;

                        }


                        message.textContent =
                            "Uploaded successfully. Waiting for approval.";


                        $("videoForm")
                            .reset();


                        await loadStatistics();
                        await loadUploads();

                    } catch (error) {

                        message.textContent =
                            "Upload failed: " +
                            error.message;

                    }

                }
            );


        /* LOGOUT */

        $("logoutButton")
            .addEventListener(
                "click",
                async function () {

                    await supabase.auth.signOut();

                    window.location.href =
                        "index.html";

                }
            );


        await loadStatistics();
        await loadUploads();

    }
);

</script>

</body>
  </html>
