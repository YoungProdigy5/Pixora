<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages | PIXORA</title>
    <link rel="stylesheet" href="style.css?v=5">

    <style>
        .messages-page {
            width: min(1100px, calc(100% - 20px));
            margin: auto;
            padding: 25px 0 100px;
        }

        .messages-title {
            margin-bottom: 18px;
        }

        .messages-title h1 {
            font-size: 28px;
            font-weight: 950;
        }

        .messages-title p {
            margin-top: 5px;
            color: #90909b;
            font-size: 13px;
        }

        .message-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: 600px;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.07);
            background: #12121a;
        }

        .conversation-list {
            border-right: 1px solid rgba(255,255,255,.07);
            overflow-y: auto;
        }

        .conversation-heading {
            padding: 17px;
            font-size: 13px;
            font-weight: 900;
        }

        .conversation-item {
            width: 100%;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 11px;
            text-align: left;
            color: #fff;
            background: transparent;
            border-bottom: 1px solid rgba(255,255,255,.04);
        }

        .conversation-item:hover,
        .conversation-item.active {
            background: rgba(255,255,255,.06);
        }

        .conversation-text {
            min-width: 0;
            flex: 1;
        }

        .conversation-user {
            font-weight: 850;
            font-size: 13px;
        }

        .conversation-preview {
            margin-top: 3px;
            color: #858590;
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .unread-badge {
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 20px;
            display: grid;
            place-items: center;
            background: #ff1744;
            color: #fff;
            font-size: 9px;
            font-weight: 900;
        }

        .mini-avatar {
            width: 38px;
            height: 38px;
            flex: 0 0 auto;
            border-radius: 50%;
            overflow: hidden;
            display: grid;
            place-items: center;
            font-size: 14px;
            font-weight: 900;
            background: linear-gradient(135deg,#ff1744,#7c3aed);
        }

        .mini-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .chat-panel {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .chat-header {
            min-height: 60px;
            padding: 10px 17px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            border-bottom: 1px solid rgba(255,255,255,.07);
            font-weight: 900;
        }

        .chat-person {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            color: inherit;
            text-decoration: none;
        }

        .chat-person span:last-child {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .presence-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #666;
            flex: 0 0 auto;
        }

        .presence-dot.online {
            background: #22c55e;
            box-shadow: 0 0 7px rgba(34,197,94,.6);
        }

        .chat-person-wrap {
            min-width: 0;
        }

        .chat-presence {
            margin-top: 2px;
            font-size: 10px;
            color: #777782;
            font-weight: 600;
        }

        .chat-tools {
            display: flex;
            gap: 12px;
            flex-shrink: 0;
        }

        .chat-tools button {
            background: transparent;
            color: #858590;
            font-size: 12px;
            text-decoration: underline;
        }

        .chat-messages {
            flex: 1;
            min-height: 460px;
            max-height: 560px;
            overflow-y: auto;
            padding: 18px;
        }

        .chat-empty {
            height: 100%;
            min-height: 400px;
            display: grid;
            place-items: center;
            color: #777782;
            text-align: center;
            padding: 20px;
        }

        .message-row {
            display: flex;
            margin-bottom: 10px;
            position: relative;
        }

        .message-row.mine {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: min(75%,480px);
            padding: 10px 13px;
            border-radius: 15px;
            background: rgba(255,255,255,.07);
            font-size: 13px;
            line-height: 1.45;
            word-break: break-word;
            position: relative;
        }

        .message-row.mine .message-bubble {
            background: linear-gradient(135deg,#ff1744,#7c3aed);
        }

        .message-bubble.deleted {
            opacity: .72;
            font-style: italic;
        }

        .message-actions {
            display: none;
            position: absolute;
            bottom: -28px;
            z-index: 5;
            padding: 5px;
            border-radius: 9px;
            background: #20202b;
            border: 1px solid rgba(255,255,255,.1);
            box-shadow: 0 5px 20px rgba(0,0,0,.25);
        }

        .message-row.mine .message-actions {
            right: 0;
        }

        .message-row:not(.mine) .message-actions {
            left: 0;
        }

        .message-row.selected .message-actions {
            display: flex;
            gap: 4px;
        }

        .message-actions button {
            border: 0;
            background: transparent;
            color: #fff;
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 800;
        }

        .message-actions button:hover {
            background: rgba(255,255,255,.1);
        }

        .message-actions .delete-action {
            color: #ff8fa3;
        }

        .message-time {
            margin-top: 4px;
            opacity: .55;
            font-size: 9px;
        }

        .message-meta {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 5px;
            margin-top: 3px;
            font-size: 9px;
            opacity: .7;
        }

        .seen-mark {
            font-weight: 900;
        }

        .blocked-banner {
            padding: 12px 17px;
            font-size: 13px;
            text-align: center;
            color: #ffb4c0;
            background: rgba(255,23,68,.1);
            border-top: 1px solid rgba(255,255,255,.07);
        }

        .blocked-banner button {
            margin-left: 8px;
            padding: 6px 12px;
            border-radius: 9px;
            color: #fff;
            background: rgba(255,255,255,.12);
            font-weight: 800;
            font-size: 12px;
        }

        .chat-status {
            min-height: 16px;
            padding: 0 14px;
            font-size: 12px;
            color: #ff8fa3;
        }

        .typing-status {
            min-height: 17px;
            padding: 0 14px 4px;
            font-size: 11px;
            color: #858590;
            font-style: italic;
        }

        .chat-form {
            display: flex;
            gap: 9px;
            padding: 12px;
            border-top: 1px solid rgba(255,255,255,.07);
            align-items: center;
        }

        .chat-form input {
            flex: 1;
            min-width: 0;
            min-height: 44px;
            padding: 0 14px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,.08);
            background: rgba(255,255,255,.05);
            color: #fff;
        }

        .chat-form button {
            min-width: 75px;
            min-height: 44px;
            border-radius: 12px;
            color: #fff;
            background: linear-gradient(135deg,#ff1744,#7c3aed);
            font-weight: 900;
        }

        .chat-form button.mic-btn {
            min-width: 46px;
            width: 46px;
            background: rgba(255,255,255,.09);
            font-size: 18px;
        }

        .record-controls {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .record-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff1744;
            animation: recordPulse 1s ease-in-out infinite;
        }

        @keyframes recordPulse {
            50% { opacity: .25; }
        }

        .record-time {
            flex: 1;
            font-weight: 800;
            font-size: 15px;
        }

        .chat-form button.record-cancel {
            background: rgba(255,255,255,.09);
        }

        @media(max-width:700px) {
            .message-layout {
                grid-template-columns: 1fr;
            }

            .conversation-list {
                max-height: 190px;
                border-right: 0;
                border-bottom: 1px solid rgba(255,255,255,.07);
            }

            .chat-messages {
                min-height: 390px;
            }

            .message-bubble {
                max-width: 82%;
            }
        }

        .light-mode .message-layout {
            background: #fff;
            border-color: rgba(0,0,0,.08);
        }

        .light-mode .conversation-item {
            color: #111116;
        }

        .light-mode .chat-form input {
            color: #111116;
            background: #f1f1f5;
            border-color: rgba(0,0,0,.08);
        }

        .light-mode .message-bubble {
            background: #eeeef3;
        }

        .light-mode .message-row.mine .message-bubble {
            color: #fff;
        }

        .light-mode .chat-form button.mic-btn,
        .light-mode .chat-form button.record-cancel {
            color: #111116;
            background: #e8e8ee;
        }

        .light-mode .message-actions {
            background: #fff;
            border-color: rgba(0,0,0,.1);
        }

        .light-mode .message-actions button {
            color: #111116;
        }

        .light-mode .message-actions .delete-action {
            color: #e11d48;
        }
    </style>
</head>

<body>

<header class="topbar">
    <a href="index.html" class="logo">PIX<span>ORA</span></a>

    <div class="top-actions">
        <a href="index.html" class="auth-btn">🏠 Home</a>
        <a href="creators.html" class="auth-btn">Creators</a>
        <a href="account.html" class="auth-btn">Account</a>
    </div>
</header>

<main class="messages-page">

    <div class="messages-title">
        <h1>Messages</h1>
        <p>Private conversations between PIXORA creators.</p>
    </div>

    <section class="message-layout">

        <aside class="conversation-list">
            <div class="conversation-heading">
                Conversations
            </div>

            <div id="conversationList"></div>
        </aside>

        <section class="chat-panel">

            <div id="chatHeader" class="chat-header">
                Select a conversation
            </div>

            <div id="chatMessages" class="chat-messages">
                <div class="chat-empty">
                    Choose a creator conversation to start messaging.
                </div>
            </div>

            <div id="blockedBanner" class="blocked-banner" hidden>
                You blocked this person.
                <button type="button" id="bannerUnblock">Unblock</button>
            </div>

            <div id="chatStatus" class="chat-status"></div>
            <div id="typingStatus" class="typing-status"></div>

            <form id="messageForm" class="chat-form">

                <input
                    id="messageInput"
                    type="text"
                    maxlength="2000"
                    placeholder="Write a message..."
                    autocomplete="off"
                >

                <button
                    type="button"
                    id="micBtn"
                    class="mic-btn"
                    aria-label="Record a voice message"
                    title="Voice message"
                >🎤</button>

                <button type="submit" id="sendBtn">
                    Send
                </button>

                <div id="recordControls" class="record-controls" hidden>
                    <span class="record-dot"></span>
                    <span class="record-time" id="recordTime">0:00</span>
                    <button type="button" id="recordCancel" class="record-cancel">Cancel</button>
                    <button type="button" id="recordSend">Send</button>
                </div>

            </form>

        </section>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>

<script>
document.addEventListener("DOMContentLoaded", async () => {

    const supabase = window.pixoraSupabase;

    if (!supabase) return;

    if (localStorage.getItem("pixoraTheme") === "light") {
        document.body.classList.add("light-mode");
    }

    const $ = id => document.getElementById(id);

    const conversationList = $("conversationList");
    const chatMessages = $("chatMessages");
    const chatHeader = $("chatHeader");
    const messageForm = $("messageForm");
    const messageInput = $("messageInput");
    const chatStatus = $("chatStatus");
    const typingStatus = $("typingStatus");

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g,"&amp;")
            .replace(/</g,"&lt;")
            .replace(/>/g,"&gt;")
            .replace(/"/g,"&quot;")
            .replace(/'/g,"&#039;");
    }

    const { data: sessionData } =
        await supabase.auth.getSession();

    const me = sessionData.session?.user;

    if (!me) {
        location.href = "login.html";
        return;
    }

    let conversations = [];
    let active = null;
    let blockedByMe = false;

    let refreshTimer = null;
    let typingTimer = null;
    let typingActive = false;
    let presenceTimer = null;

    let realtimeChannel = null;

    /* =====================================================
       HELPERS
       ===================================================== */

    function displayName(profile) {
        return profile?.display_name ||
               profile?.username ||
               "PIXORA Creator";
    }

    function avatarHtml(profile) {

        const name = displayName(profile);

        const inner = profile?.avatar_url
            ? `<img src="${escapeHtml(profile.avatar_url)}" alt="">`
            : escapeHtml(name.charAt(0).toUpperCase());

        return `<span class="mini-avatar">${inner}</span>`;
    }

    function formatSeconds(total) {

        const seconds =
            Math.max(0, Math.round(total || 0));

        return Math.floor(seconds / 60) +
            ":" +
            String(seconds % 60).padStart(2,"0");
    }

    function previewText(message) {

        if (!message) return "No messages yet.";

        if (message.deleted_at) {
            return "This message was deleted";
        }

        if (message.kind === "audio") {
            return "🎤 Voice message";
        }

        if (message.kind === "file") {
            return "📎 " + (message.label || "File");
        }

        if (message.kind === "poll") {
            return "📊 " + (message.label || "Poll");
        }

        return message.body || "";
    }

    function setStatus(text) {
        chatStatus.textContent = text || "";
    }

    function setTypingStatus(text) {
        typingStatus.textContent = text || "";
    }

    function scheduleListRefresh() {

        clearTimeout(refreshTimer);

        refreshTimer =
            setTimeout(loadConversations, 500);
    }

    /* =====================================================
       CONVERSATION LIST
       ===================================================== */

    async function loadConversations() {

        const { data, error } =
            await supabase.rpc("get_my_conversations");

        if (error) {

            console.error("get_my_conversations:", error);

            /*
             * Fallback to the existing direct query.
             * This keeps the page usable if the RPC response
             * changes or is temporarily unavailable.
             */

            await loadConversationsFallback();

            return;
        }

        const rows = data || [];

        /*
         * IMPORTANT: these field names must match the actual
         * columns returned by public.get_my_conversations():
         *
         *   conversation_id, is_group, group_name, member_count,
         *   other_user_id, username, display_name, avatar_url,
         *   last_body, last_kind, last_label, last_deleted,
         *   last_sender_id, last_sender_name, last_created_at,
         *   unread_count
         *
         * Previous version read row.latest_message / latest_kind /
         * latest_created_at / latest_sender_id / conversation_name,
         * none of which exist on the row — so `latest` was always
         * null and every conversation showed "No messages yet."
         */

        conversations =
            rows.map(row => ({
                id: row.conversation_id,
                otherId: row.other_user_id,
                profile: {
                    user_id: row.other_user_id,
                    username: row.username,
                    display_name: row.display_name,
                    avatar_url: row.avatar_url
                },
                latest: row.last_created_at
                    ? {
                        body: row.last_body,
                        kind: row.last_kind || "text",
                        created_at: row.last_created_at,
                        sender_id: row.last_sender_id,
                        deleted_at: row.last_deleted || false,
                        label: row.last_label
                    }
                    : null,
                unreadCount: Number(row.unread_count || 0),
                isGroup: !!row.is_group,
                conversationName: row.group_name || null,
                memberCount: Number(row.member_count || 0)
            }));

        if (active) {

            const fresh =
                conversations.find(
                    item =>
                        String(item.id) === String(active.id)
                );

            if (fresh) {
                active = fresh;
            }
        }

        renderConversationList();
    }

    async function loadConversationsFallback() {

        const { data: memberships, error } =
            await supabase
                .from("conversation_members")
                .select("conversation_id,last_read_at")
                .eq("user_id", me.id);

        if (error) {
            console.error(error);
            return;
        }

        const ids =
            (memberships || [])
                .map(item => item.conversation_id);

        if (!ids.length) {

            conversations = [];

            renderConversationList();

            return;
        }

        const { data: convRows } =
            await supabase
                .from("conversations")
                .select("id,is_group,name")
                .in("id", ids);

        const conversationMap = {};

        (convRows || []).forEach(row => {
            conversationMap[row.id] = row;
        });

        const { data: others } =
            await supabase
                .from("conversation_members")
                .select("conversation_id,user_id")
                .in("conversation_id", ids)
                .neq("user_id", me.id);

        const otherByConversation = {};

        (others || []).forEach(item => {

            if (!otherByConversation[item.conversation_id]) {
                otherByConversation[item.conversation_id] =
                    item.user_id;
            }
        });

        const otherIds =
            [...new Set(Object.values(otherByConversation))];

        const profiles = {};

        if (otherIds.length) {

            const { data: profileRows } =
                await supabase
                    .from("profiles")
                    .select(
                        "user_id,username,display_name,avatar_url"
                    )
                    .in("user_id", otherIds);

            (profileRows || []).forEach(row => {
                profiles[row.user_id] = row;
            });
        }

        const latestResults =
            await Promise.all(
                ids.map(id =>
                    supabase
                        .from("messages")
                        .select(
                            "id,body,kind,sender_id,created_at,deleted_at"
                        )
                        .eq("conversation_id", id)
                        .order("created_at", {
                            ascending:false
                        })
                        .limit(1)
                        .maybeSingle()
                )
            );

        const unreadResults =
            await Promise.all(
                memberships.map(member =>
                    supabase
                        .from("messages")
                        .select(
                            "id",
                            { count:"exact", head:true }
                        )
                        .eq(
                            "conversation_id",
                            member.conversation_id
                        )
                        .neq("sender_id", me.id)
                        .gt(
                            "created_at",
                            member.last_read_at
                        )
                )
            );

        conversations =
            ids
                .map((id,index) => {

                    const conv =
                        conversationMap[id] || {};

                    const otherId =
                        otherByConversation[id];

                    const latest =
                        latestResults[index]?.data || null;

                    const membershipIndex =
                        memberships.findIndex(
                            item =>
                                String(item.conversation_id) ===
                                String(id)
                        );

                    return {
                        id,
                        otherId,
                        profile:
                            profiles[otherId] || null,
                        latest,
                        unreadCount:
                            unreadResults[membershipIndex]?.count || 0,
                        isGroup: !!conv.is_group,
                        conversationName:
                            conv.name || null
                    };
                })
                .filter(item => item.isGroup || item.otherId)
                .sort((a,b) => {

                    const aTime =
                        a.latest
                            ? new Date(a.latest.created_at).getTime()
                            : 0;

                    const bTime =
                        b.latest
                            ? new Date(b.latest.created_at).getTime()
                            : 0;

                    return bTime - aTime;
                });

        renderConversationList();
    }

    function renderConversationList() {

        conversationList.innerHTML = "";

        if (!conversations.length) {

            conversationList.innerHTML =
                `<div style="padding:17px;color:#777;font-size:12px">
                    No conversations yet.
                </div>`;

            return;
        }

        conversations.forEach(item => {

            const button =
                document.createElement("button");

            button.type = "button";

            button.className =
                "conversation-item" +
                (
                    active &&
                    String(active.id) === String(item.id)
                        ? " active"
                        : ""
                );

            const name =
                item.isGroup
                    ? (item.conversationName || "PIXORA Group")
                    : displayName(item.profile);

            const avatar =
                item.isGroup
                    ? `<span class="mini-avatar">👥</span>`
                    : avatarHtml(item.profile);

            button.innerHTML = `
                ${avatar}

                <span class="conversation-text">
                    <div class="conversation-user">
                        ${escapeHtml(name)}
                    </div>

                    <div class="conversation-preview">
                        ${escapeHtml(previewText(item.latest))}
                    </div>
                </span>

                ${
                    item.unreadCount > 0
                        ? `<span class="unread-badge">
                            ${item.unreadCount > 99 ? "99+" : item.unreadCount}
                           </span>`
                        : ""
                }
            `;

            button.addEventListener(
                "click",
                () => openConversation(item.id)
            );

            conversationList.appendChild(button);
        });
    }

    /* =====================================================
       BLOCK STATE
       ===================================================== */

    async function loadBlockState() {

        if (!active || active.isGroup) {

            blockedByMe = false;

            return;
        }

        const { data, error } =
            await supabase
                .from("blocks")
                .select("blocker_id")
                .eq("blocker_id", me.id)
                .eq("blocked_id", active.otherId)
                .maybeSingle();

        if (error) {
            console.error(error);
        }

        blockedByMe = !!data;
    }

    /* =====================================================
       PRESENCE
       ===================================================== */

    async function getOtherPresence() {

        if (!active || active.isGroup) {
            return false;
        }

        const { data } =
            await supabase
                .from("presence")
                .select("last_seen")
                .eq("user_id", active.otherId)
                .maybeSingle();

        if (!data?.last_seen) {
            return false;
        }

        const age =
            Date.now() -
            new Date(data.last_seen).getTime();

        return age < 60000;
    }

    async function touchMyPresence() {

        try {
            await supabase.rpc("touch_presence");
        } catch (error) {
            console.error("presence:", error);
        }
    }

    async function refreshPresence() {

        if (!active || active.isGroup) return;

        const online =
            await getOtherPresence();

        const dot =
            $("presenceDot");

        const text =
            $("presenceText");

        if (dot) {
            dot.classList.toggle("online", online);
        }

        if (text) {
            text.textContent =
                online
                    ? "Online"
                    : "Offline";
        }
    }

    /* =====================================================
       HEADER
       ===================================================== */

                    <span>
                        ${escapeHtml(name)}

    function updateComposer() {

        const locked =
            !active || blockedByMe;

        messageForm.hidden =
            !active || blockedByMe;

        $("blockedBanner").hidden =
            !blockedByMe;

        messageInput.disabled =
            locked;
    }

    async function toggleBlock() {

        if (!active || active.isGroup) return;

        if (!blockedByMe) {

            if (
                !confirm(
                    "Block " +
                    displayName(active.profile) +
                    "? You won't be able to message each other."
                )
            ) {
                return;
            }

            const { error } =
                await supabase
                    .from("blocks")
                    .insert({
                        blocker_id: me.id,
                        blocked_id: active.otherId
                    });

            if (error && error.code !== "23505") {

                setStatus(
                    "Could not block. Try again."
                );

                return;
            }

            await supabase
                .from("follows")
                .delete()
                .eq("follower_id", me.id)
                .eq("following_id", active.otherId);

            blockedByMe = true;

        } else {

            const { error } =
                await supabase
                    .from("blocks")
                    .delete()
                    .eq("blocker_id", me.id)
                    .eq("blocked_id", active.otherId);

            if (error) {

                setStatus(
                    "Could not unblock. Try again."
                );

                return;
            }

            blockedByMe = false;
        }

        setStatus("");

        renderHeader();
        updateComposer();
    }

    async function reportUser() {

        if (!active || active.isGroup) return;

        const reason =
            (
                prompt(
                    "Why are you reporting " +
                    displayName(active.profile) +
                    "?"
                ) || ""
            ).trim();

        if (!reason) return;

        if (
            reason.length < 3 ||
            reason.length > 500
        ) {

            setStatus(
                "Please write between 3 and 500 characters."
            );

            return;
        }

        const { error } =
            await supabase
                .from("reports")
                .insert({
                    reporter_id: me.id,
                    reported_user_id: active.otherId,
                    reason
                });

        if (error) {

            console.error(error);

            setStatus(
                "Could not send the report. Try again."
            );

            return;
        }

        setStatus(
            "Thanks. Your report was sent to the PIXORA team."
        );
    }

    $("bannerUnblock")
        .addEventListener("click", toggleBlock);

    /* =====================================================
       VOICE URLS
       ===================================================== */

    async function signedUrlsFor(messages) {

        const paths =
            messages
                .filter(
                    item =>
                        item.kind === "audio" &&
                        item.audio_path
                )
                .map(item => item.audio_path);

        const urls = {};

        if (!paths.length) {
            return urls;
        }

        const { data, error } =
            await supabase
                .storage
                .from("voice-messages")
                .createSignedUrls(
                    paths,
                    3600
                );

        if (error) {

            console.error(
                "Voice URLs:",
                error
            );

            return urls;
        }

        (data || []).forEach(item => {

            if (item.signedUrl) {
                urls[item.path] =
                    item.signedUrl;
            }
        });

        return urls;
    }

    /* =====================================================
       DELETE MESSAGE
       ===================================================== */

    async function deleteMessage(message) {

        if (!message) return;

        if (message.sender_id !== me.id) {
            return;
        }

        if (message.deleted_at) {
            return;
        }

        if (
            !confirm(
                "Delete this message for everyone?"
            )
        ) {
            return;
        }

        setStatus("Deleting message...");

        const { error } =
            await supabase.rpc(
                "delete_message",
                {
                    p_message_id: message.id
                }
            );

        if (error) {

            console.error(
                "delete_message:",
                error
            );

            setStatus(
                error.code === "42501"
                    ? "You can only delete your own messages."
                    : "Could not delete the message. Try again."
            );

            return;
        }

        setStatus("");

        await loadMessages();

        scheduleListRefresh();
    }

    /* =====================================================
       MESSAGE RENDERING
       ===================================================== */

    function renderMessage(message, urls) {

        const row =
            document.createElement("div");

        const mine =
            message.sender_id === me.id;

        row.className =
            "message-row" +
            (mine ? " mine" : "");

        row.dataset.messageId =
            message.id;

        const bubble =
            document.createElement("div");

        bubble.className =
            "message-bubble";

        const time =
            new Date(message.created_at)
                .toLocaleTimeString(
                    [],
                    {
                        hour:"2-digit",
                        minute:"2-digit"
                    }
                );

        if (message.deleted_at) {

            bubble.classList.add("deleted");

            bubble.innerHTML = `
                <div>
                    ${
                        mine
                            ? "You deleted this message"
                            : "This message was deleted"
                    }
                </div>

                <div class="message-time">
                    ${escapeHtml(time)}
                </div>
            `;

            row.appendChild(bubble);

            chatMessages.appendChild(row);

            return;
        }

        let content;

        if (message.kind === "audio") {

            const url =
                urls[message.audio_path];

            content = `
                <div class="voice-label">
                    🎤 Voice message ·
                    ${escapeHtml(
                        formatSeconds(
                            message.audio_seconds
                        )
                    )}
                </div>

                ${
                    url
                        ? `
                            <audio
                                controls
                                preload="metadata"
                                src="${escapeHtml(url)}"
                            ></audio>
                          `
                        : `
                            <div class="voice-label">
                                Could not load this voice message.
                            </div>
                          `
                }
            `;

        } else {

            content =
                `<div>${escapeHtml(message.body)}</div>`;
        }

        let seenText = "";

        if (mine) {

            seenText =
                message.read_at
                    ? "✓✓ Seen"
                    : "✓ Sent";
        }

        bubble.innerHTML = `
            ${content}

            <div class="message-meta">
                <span class="message-time">
                    ${escapeHtml(time)}
                </span>

                ${
                    mine
                        ? `
                            <span class="seen-mark">
                                ${escapeHtml(seenText)}
                            </span>
                          `
                        : ""
                }
            </div>
        `;

        if (mine) {

            const actions =
                document.createElement("div");

            actions.className =
                "message-actions";

            actions.innerHTML = `
                <button
                    type="button"
                    class="delete-action"
                >
                    Delete
                </button>
            `;

            actions
                .querySelector(".delete-action")
                .addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();

                        deleteMessage(message);
                    }
                );

            bubble.appendChild(actions);
        }

        row.appendChild(bubble);

        row.addEventListener(
            "click",
            event => {

                if (
                    event.target.closest(
                        ".message-actions"
                    )
                ) {
                    return;
                }

                document
                    .querySelectorAll(
                        ".message-row.selected"
                    )
                    .forEach(item => {

                        if (item !== row) {
                            item.classList.remove(
                                "selected"
                            );
                        }
                    });

                row.classList.toggle(
                    "selected"
                );
            }
        );

        chatMessages.appendChild(row);
    }

    /* =====================================================
       LOAD MESSAGES
       ===================================================== */

    async function loadMessages() {

        if (!active) return;

        const conversationId =
            active.id;

        const { data, error } =
            await supabase
                .from("messages")
                .select(
                    "id,sender_id,body,created_at,read_at,kind,audio_path,audio_seconds,deleted_at,forwarded"
                )
                .eq(
                    "conversation_id",
                    conversationId
                )
                .order(
                    "created_at",
                    {
                        ascending:true
                    }
                );

        if (error) {

            console.error(error);

            chatMessages.innerHTML =
                `<div class="chat-empty">
                    Could not load messages.
                </div>`;

            return;
        }

        if (
            !active ||
            String(active.id) !==
            String(conversationId)
        ) {
            return;
        }

        chatMessages.innerHTML = "";

        if (!data?.length) {

            chatMessages.innerHTML =
                `<div class="chat-empty">
                    No messages yet. Say hello 👋
                </div>`;

        } else {

            const urls =
                await signedUrlsFor(data);

            data.forEach(
                message =>
                    renderMessage(
                        message,
                        urls
                    )
            );

            chatMessages.scrollTop =
                chatMessages.scrollHeight;
        }

        await markConversationRead();
    }

        let conversation =
            conversations.find(
                item =>
                    String(item.id) ===

            await loadConversations();

            conversation =
                conversations.find(

                `<div class="chat-empty">

        cancelRecordingSilently();

        active = conversation;

        blockedByMe = false;

        setStatus("");
        setTypingStatus("");

        renderConversationList();

        renderHeader();

        await loadBlockState();

        renderHeader();

        updateComposer();

        await loadMessages();

        await refreshPresence();

        startPresenceRefresh();

            return;
        }

        const { data, error } =
            await supabase
                .from("typing_status")
                .select(

    /* =====================================================
       VOICE MESSAGES
       ===================================================== */

    const MAX_RECORD_SECONDS = 180;

    let recorder = null;
    let recordStream = null;
    let recordChunks = [];
    let recordStartedAt = 0;
    let recordTimer = null;
    let finishing = false;

    const canRecord =
        !!(
            navigator.mediaDevices &&
            navigator.mediaDevices.getUserMedia &&
            window.MediaRecorder
        );

    if (!canRecord) {
        $("micBtn").hidden = true;
    }

    function pickMimeType() {

        const options = [
            "audio/webm;codecs=opus",
            "audio/webm",
            "audio/mp4",
            "audio/ogg;codecs=opus"
        ];

        return options.find(
            type =>
                window.MediaRecorder.isTypeSupported &&
                MediaRecorder.isTypeSupported(type)
        ) || "";
    }

    function showRecordingUi(recording) {

        $("recordControls").hidden =
            !recording;

        messageInput.hidden =
            recording;

        $("micBtn").hidden =
            recording || !canRecord;

        $("sendBtn").hidden =
            recording;
    }

    function stopTracks() {

        clearInterval(recordTimer);

        recordTimer = null;

        if (recordStream) {

            recordStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );
        }

        recordStream = null;

        recorder = null;

        recordChunks = [];

        showRecordingUi(false);
    }

    function cancelRecordingSilently() {

        if (
            recorder &&
            recorder.state !== "inactive"
        ) {

            recorder.onstop = null;

            recorder.stop();
        }

        finishing = false;

        stopTracks();
    }

    async function startRecording() {

        if (
            !active ||
            blockedByMe ||
            recorder
        ) {
            return;
        }

        setStatus("");

        try {

            recordStream =
                await navigator.mediaDevices
                    .getUserMedia({
                        audio:true
                    });

        } catch (error) {

            console.error(error);

            setStatus(
                "Allow microphone access in your browser to send voice messages."
            );

            return;
        }

        const mimeType =
            pickMimeType();

        try {

            recorder =
                mimeType
                    ? new MediaRecorder(
                        recordStream,
                        { mimeType }
                    )
                    : new MediaRecorder(
                        recordStream
                    );

        } catch (error) {

            console.error(error);

            stopTracks();

            setStatus(
                "Voice messages aren't supported in this browser."
            );

            return;
        }

        recordChunks = [];

        recorder.ondataavailable =
            event => {

                if (
                    event.data &&
                    event.data.size
                ) {

                    recordChunks.push(
                        event.data
                    );
                }
            };

        recorder.start();

        recordStartedAt =
            Date.now();

        $("recordTime").textContent =
            "0:00";

        showRecordingUi(true);

        recordTimer =
            setInterval(
                () => {

                    const elapsed =
                        (
                            Date.now() -
                            recordStartedAt
                        ) / 1000;

                    $("recordTime").textContent =
                        formatSeconds(
                            elapsed
                        );

                    if (
                        elapsed >=
                        MAX_RECORD_SECONDS
                    ) {

                        finishRecording(true);
                    }

                },
                250
            );
    }

    function stopRecorder() {

        return new Promise(
            resolve => {

                const current =
                    recorder;

                current.onstop =
                    () => {

                        const type =
                            (
                                current.mimeType ||
                                "audio/webm"
                            ).split(";")[0];

                        resolve({
                            blob:
                                new Blob(
                                    recordChunks,
                                    { type }
                                ),

                            mime:type,

                            seconds:
                                Math.round(
                                    (
                                        Date.now() -
                                        recordStartedAt
                                    ) / 1000
                                )
                        });
                    };

                if (
                    current.state !==
                    "inactive"
                ) {

                    current.stop();

                } else {

                    current.onstop();
                }
            }
        );
    }

    async function finishRecording(send) {

        if (
            !recorder ||
            finishing
        ) {
            return;
        }

        finishing = true;

        const result =
            await stopRecorder();

        stopTracks();

        finishing = false;

        if (!send) return;

        await sendVoice(result);
    }

    async function sendVoice(result) {

        if (
            !active ||
            blockedByMe
        ) {
            return;
        }

        if (
            result.seconds < 1 ||
            result.blob.size < 800
        ) {

            setStatus(
                "That recording was too short."
            );

            return;
        }

        const seconds =
            Math.min(
                300,
                Math.max(
                    1,
                    result.seconds
                )
            );

        const extension =
            result.mime.includes("mp4")
                ? "m4a"
                : result.mime.includes("ogg")
                    ? "ogg"
                    : result.mime.includes("mpeg")
                        ? "mp3"
                        : "webm";

        const path =
            active.id +
            "/" +
            me.id +
            "/" +
            Date.now() +
            "." +
            extension;

        setStatus(
            "Sending voice message..."
        );

        const upload =
            await supabase
                .storage
                .from("voice-messages")
                .upload(
                    path,
                    result.blob,
                    {
                        contentType:
                            result.mime
                    }
                );

        if (upload.error) {

            console.error(
                upload.error
            );

            setStatus(
                "Could not upload the voice message. Try again."
            );

            return;
        }

        const insert =
            await supabase
                .from("messages")
                .insert({
                    conversation_id:
                        active.id,
                    sender_id:
                        me.id,
                    body:"",
                    kind:"audio",
                    audio_path:path,
                    audio_seconds:
                        seconds
                });

        if (insert.error) {

            console.error(
                insert.error
            );

            await supabase
                .storage
                .from("voice-messages")
                .remove([path]);

            setStatus(
                sendErrorText(
                    insert.error
                )
            );

            return;
        }

        setStatus("");

        await loadMessages();

        scheduleListRefresh();
    }

    $("micBtn")
        .addEventListener(
            "click",
            startRecording
        );

    $("recordCancel")
        .addEventListener(

    /* =====================================================
       REALTIME
       ===================================================== */

    realtimeChannel =
        supabase
            .channel(
                "pixora-messages-" +
                me.id
            )

            .on(
                "postgres_changes",
                {
                    event:"INSERT",
                    schema:"public",
                    table:"messages"
                },
                async payload => {

                    const message =
                        payload.new;

                    if (
                        active &&
                        String(
                            message.conversation_id
                        ) ===
                        String(active.id) &&
                        message.sender_id !== me.id
                    ) {

                        const urls =
                            await signedUrlsFor(
                                [message]
                            );

                        const empty =
                            chatMessages
                                .querySelector(
                                    ".chat-empty"
                                );

                        if (empty) {
                            chatMessages.innerHTML =
                                "";
                        }

                        renderMessage(
                            message,
                            urls
                        );

                        chatMessages.scrollTop =
                            chatMessages.scrollHeight;

                        await markConversationRead();
                    }

                    scheduleListRefresh();
                }
            )

            .on(
                "postgres_changes",
                {
                    event:"UPDATE",
                    schema:"public",
                    table:"messages"
                },
                async payload => {

                    const message =
                        payload.new;

                    if (
                        active &&
                        String(
                            message.conversation_id
                        ) ===
                        String(active.id)
                    ) {

                        await loadMessages();
                    }

                    scheduleListRefresh();
                }
            )

            .on(
                "postgres_changes",
                {
                    event:"INSERT",
                    schema:"public",
                    table:"typing_status"
                },
                async payload => {

                    if (
                        active &&
                        String(
                            payload.new.conversation_id
                        ) ===
                        String(active.id)
                    ) {

                        await refreshTyping();
                    }
                }
            )

            .on(
                "postgres_changes",
                {
                    event:"UPDATE",
                    schema:"public",
                    table:"typing_status"
                },
                async payload => {

                    if (
                        active &&
                        String(
                            payload.new.conversation_id
                        ) ===
                        String(active.id)
                    ) {

                        await refreshTyping();
                    }
                }
            )

            .on(
                "postgres_changes",
                {
                    event:"DELETE",
                    schema:"public",
                    table:"typing_status"
                },
                async payload => {

                    if (
                        active &&
                        String(
                            payload.old.conversation_id
                        ) ===
                        String(active.id)
                    ) {

                        await refreshTyping();
                    }
                }
            )

            .subscribe();

    /* =====================================================
       PERIODIC PRESENCE / TYPING
       ===================================================== */

    async function startPresenceRefresh() {

        clearInterval(
            presenceTimer
        );

        await touchMyPresence();

        presenceTimer =
            setInterval(
                async () => {

                    await touchMyPresence();

                    if (active) {
                        await refreshPresence();
                        await refreshTyping();
                    }

                },
                15000
            );
    }

    document.addEventListener(
        "visibilitychange",
        async () => {

            if (
                document.visibilityState ===
                "visible"
            ) {

                await touchMyPresence();

                if (active) {
                    await refreshPresence();
                    await refreshTyping();
                }
            }
        }
    );

    window.addEventListener(
        "beforeunload",
        () => {

            clearInterval(
                presenceTimer
            );

            clearTimeout(
                typingTimer
            );
        }
    );

    /* =====================================================
       START
       ===================================================== */

    updateComposer();

    await touchMyPresence();

    await loadConversations();

    const requested =
        new URLSearchParams(
            location.search
        ).get("conversation");

    if (requested) {
        await openConversation(
            requested
        );
    }

});
</script>

</body>
