<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIXORA | Admin Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0b0f;
      font-family: Arial, sans-serif;
      color: white;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: #111118;
      padding: 35px 25px;
      border-radius: 18px;
      border: 1px solid #24242d;
      box-shadow: 0 15px 40px rgba(0,0,0,.4);
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .logo span {
      color: #ff1744;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border-radius: 10px;
      border: 1px solid #33333d;
      background: #0b0b0f;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #ff1744;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #ff1744;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      PIXORA<span>.</span>
    </div>

    <p class="subtitle">Admin Login</p>

    <form id="loginForm">

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter admin email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter password"
        required
      >

      <button type="submit" id="loginButton">
        Login
      </button>

      <div id="message"></div>

    </form>

  </div>

  <script>
    // ==========================================
    // PIXORA SUPABASE CONNECTION
    // ==========================================

    const SUPABASE_URL = "hlldyvzgvblxmnygldqd";
    const SUPABASE_ANON_KEY = "sb_publishable_mg6WiPQq2BTk_2YTdJkaJA_f4zQwPF-";

    const { createClient } = supabase;

    const supabaseClient = createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


    // ==========================================
    // LOGIN
    // ==========================================

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");

    loginForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      loginButton.disabled = true;
      loginButton.textContent = "Logging in...";
      message.textContent = "";

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {

        message.textContent = "Login failed: " + error.message;
        message.style.color = "#ff1744";

        loginButton.disabled = false;
        loginButton.textContent = "Login";

        return;
      }

      message.textContent = "Login successful!";
      message.style.color = "#00d26a";

      // Temporary destination.
      // We'll replace this with the PIXORA admin dashboard.
      setTimeout(() => {
        window.location.href = "index.html";
      }, 800);

    });
  </script>

</body>
  </html>
