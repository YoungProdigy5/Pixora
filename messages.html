<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages | PIXORA</title>
    <link rel="stylesheet" href="style.css?v=4">

    <style>
        .messages-page {
            width: min(1100px, calc(100% - 20px));
            margin: auto;
            padding: 25px 0 100px;
        }

        .messages-title {
            margin-bottom: 18px;
        }

        .messages-title h1 {
            font-size: 28px;
            font-weight: 950;
        }

        .messages-title p {
            margin-top: 5px;
            color: #90909b;
            font-size: 13px;
        }

        .message-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: 600px;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.07);
            background: #12121a;
        }

        .conversation-list {
            border-right: 1px solid rgba(255,255,255,.07);
            overflow-y: auto;
        }

        .conversation-heading {
            padding: 17px;
            font-size: 13px;
            font-weight: 900;
        }

        .conversation-item {
            width: 100%;
            padding: 14px;
            text-align: left;
            color: #fff;
            background: transparent;
            border-bottom: 1px solid rgba(255,255,255,.04);
        }

        .conversation-item:hover,
        .conversation-item.active {
            background: rgba(255,255,255,.06);
        }

        .conversation-user {
            font-weight: 850;
            font-size: 13px;
        }

        .conversation-preview {
            margin-top: 3px;
            color: #858590;
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-panel {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .chat-header {
            min-height: 60px;
            padding: 15px 17px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,.07);
            font-weight: 900;
        }

        .chat-messages {
            flex: 1;
            min-height: 460px;
            max-height: 560px;
            overflow-y: auto;
            padding: 18px;
        }

        .chat-empty {
            height: 100%;
            min-height: 400px;
            display: grid;
            place-items: center;
            color: #777782;
            text-align: center;
            padding: 20px;
        }

        .message-row {
            display: flex;
            margin-bottom: 10px;
        }

        .message-row.mine {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: min(75%,480px);
            padding: 10px 13px;
            border-radius: 15px;
            background: rgba(255,255,255,.07);
            font-size: 13px;
            line-height: 1.45;
            word-break: break-word;
        }

        .message-row.mine .message-bubble {
            background: linear-gradient(135deg,#ff1744,#7c3aed);
        }

        .message-time {
            margin-top: 4px;
            opacity: .55;
            font-size: 9px;
        }

        .chat-form {
            display: flex;
            gap: 9px;
            padding: 12px;
            border-top: 1px solid rgba(255,255,255,.07);
        }

        .chat-form input {
            flex: 1;
            min-height: 44px;
            padding: 0 14px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,.08);
            background: rgba(255,255,255,.05);
            color: #fff;
        }

        .chat-form button {
            min-width: 75px;
            border-radius: 12px;
            color: #fff;
            background: linear-gradient(135deg,#ff1744,#7c3aed);
            font-weight: 900;
        }

        @media(max-width:700px) {
            .message-layout {
                grid-template-columns: 1fr;
            }

            .conversation-list {
                max-height: 190px;
                border-right: 0;
                border-bottom: 1px solid rgba(255,255,255,.07);
            }

            .chat-messages {
                min-height: 390px;
            }
        }
    </style>
</head>

<body>

<header class="topbar">
    <a href="index.html" class="logo">PIX<span>ORA</span></a>

    <div class="top-actions">
        <a href="creators.html" class="auth-btn">Creators</a>
        <a href="account.html" class="auth-btn">Account</a>
    </div>
</header>

<main class="messages-page">

    <div class="messages-title">
        <h1>Messages</h1>
        <p>Private conversations between PIXORA creators.</p>
    </div>

    <section class="message-layout">

        <aside class="conversation-list">
            <div class="conversation-heading">
                Conversations
            </div>

            <div id="conversationList"></div>
        </aside>

        <section class="chat-panel">

            <div id="chatHeader" class="chat-header">
                Select a conversation
            </div>

            <div id="chatMessages" class="chat-messages">
                <div class="chat-empty">
                    Choose a creator conversation to start messaging.
                </div>
            </div>

            <form id="messageForm" class="chat-form">
                <input
                    id="messageInput"
                    type="text"
                    maxlength="2000"
                    placeholder="Write a message..."
                    autocomplete="off"
                >

                <button type="submit">
                    Send
                </button>
            </form>

        </section>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>

<script>
document.addEventListener("DOMContentLoaded", async () => {

    const supabase = window.pixoraSupabase;

    if (!supabase) return;

    const conversationList =
        document.getElementById("conversationList");

    const chatMessages =
        document.getElementById("chatMessages");

    const chatHeader =
        document.getElementById("chatHeader");

    const messageForm =
        document.getElementById("messageForm");

    const messageInput =
        document.getElementById("messageInput");

    let currentUser = null;
    let activeConversation = null;
    let realtimeChannel = null;

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g,"&amp;")
            .replace(/</g,"&lt;")
            .replace(/>/g,"&gt;")
            .replace(/"/g,"&quot;")
            .replace(/'/g,"&#039;");
    }

    const { data: sessionData } =
        await supabase.auth.getSession();

    currentUser = sessionData.session?.user;

    if (!currentUser) {
        location.href = "login.html";
        return;
    }

    async function getOtherUser(conversationId) {

        const { data } =
            await supabase
                .from("conversation_members")
                .select("user_id")
                .eq("conversation_id", conversationId)
                .neq("user_id", currentUser.id)
                .limit(1);

        return data?.[0]?.user_id || null;
    }

    async function getProfile(userId) {

        const { data } =
            await supabase
                .from("profiles")
                .select("user_id,username,display_name,avatar_url")
                .eq("user_id", userId)
                .maybeSingle();

        return data;
    }

    async function loadConversations() {

        const { data: memberships, error } =
            await supabase
                .from("conversation_members")
                .select("conversation_id")
                .eq("user_id", currentUser.id);

        if (error) {
            console.error(error);
            return;
        }

        conversationList.innerHTML = "";

        if (!memberships?.length) {
            conversationList.innerHTML =
                `<div style="padding:17px;color:#777;font-size:12px">
                    No conversations yet.
                </div>`;
            return;
        }

        for (const membership of memberships) {

            const id = membership.conversation_id;

            const otherId =
                await getOtherUser(id);

            if (!otherId) continue;

            const profile =
                await getProfile(otherId);

            const { data: latest } =
                await supabase
                    .from("messages")
                    .select("body,created_at")
                    .eq("conversation_id",id)
                    .order("created_at",{ascending:false})
                    .limit(1)
                    .maybeSingle();

            const button =
                document.createElement("button");

            button.className =
                "conversation-item" +
                (String(activeConversation) === String(id)
                    ? " active"
                    : "");

            button.innerHTML = `
                <div class="conversation-user">
                    ${escapeHtml(
                        profile?.display_name ||
                        profile?.username ||
                        "PIXORA Creator"
                    )}
                </div>

                <div class="conversation-preview">
                    ${escapeHtml(
                        latest?.body ||
                        "No messages yet."
                    )}
                </div>
            `;

            button.onclick = () => {
                openConversation(id);
            };

            conversationList.appendChild(button);
        }
    }

    async function loadMessages(conversationId) {

        const { data, error } =
            await supabase
                .from("messages")
                .select("id,sender_id,body,created_at")
                .eq("conversation_id",conversationId)
                .order("created_at",{ascending:true});

        if (error) {
            console.error(error);
            return;
        }

        chatMessages.innerHTML = "";

        if (!data?.length) {
            chatMessages.innerHTML =
                `<div class="chat-empty">
                    No messages yet. Say hello 👋
                </div>`;
            return;
        }

        data.forEach(renderMessage);

        chatMessages.scrollTop =
            chatMessages.scrollHeight;
    }

    function renderMessage(message) {

        const row =
            document.createElement("div");

        const mine =
            message.sender_id === currentUser.id;

        row.className =
            "message-row" +
            (mine ? " mine" : "");

        const bubble =
            document.createElement("div");

        bubble.className =
            "message-bubble";

        const time =
            new Date(message.created_at)
                .toLocaleTimeString([], {
                    hour:"2-digit",
                    minute:"2-digit"
                });

        bubble.innerHTML = `
            <div>${escapeHtml(message.body)}</div>
            <div class="message-time">
                ${escapeHtml(time)}
            </div>
        `;

        row.appendChild(bubble);
        chatMessages.appendChild(row);
    }

    async function openConversation(id) {

        activeConversation = id;

        const otherId =
            await getOtherUser(id);

        const profile =
            await getProfile(otherId);

        chatHeader.textContent =
            profile?.display_name ||
            profile?.username ||
            "PIXORA Creator";

        await loadMessages(id);
        await loadConversations();

        if (realtimeChannel) {
            await supabase.removeChannel(realtimeChannel);
        }

        realtimeChannel =
            supabase
                .channel("pixora-chat-" + id)
                .on(
                    "postgres_changes",
                    {
                        event:"INSERT",
                        schema:"public",
                        table:"messages",
                        filter:"conversation_id=eq." + id
                    },
                    payload => {

                        if (
                            payload.new.sender_id !==
                            currentUser.id
                        ) {
                            renderMessage(payload.new);

                            chatMessages.scrollTop =
                                chatMessages.scrollHeight;
                        }

                        loadConversations();
                    }
                )
                .subscribe();
    }

    messageForm.addEventListener("submit", async event => {

        event.preventDefault();

        if (!activeConversation) {
            alert("Select a conversation first.");
            return;
        }

        const body =
            messageInput.value.trim();

        if (!body) return;

        messageInput.disabled = true;

        const { error } =
            await supabase
                .from("messages")
                .insert({
                    conversation_id: activeConversation,
                    sender_id: currentUser.id,
                    body
                });

        messageInput.disabled = false;

        if (error) {
            console.error(error);
            alert("Message could not be sent.");
            return;
        }

        messageInput.value = "";

        await loadMessages(activeConversation);
        await loadConversations();
    });

    await loadConversations();

    const requested =
        new URLSearchParams(location.search)
            .get("conversation");

    if (requested) {
        await openConversation(requested);
    }
});
</script>

</body>
  </html>
